<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<title>MusicDEV</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout : rail de modules à gauche (onglets de cartable), pupitre au centre avec la portée, réponse dessous. */
:root{
  --paper:#EEF2EE; --surface:#FFFFFF; --sunk:#E4EAE5; --ink:#17212E; --muted:#556171; --line:#CCD5CE;
  --accent:#2445C2; --accent-ink:#FFFFFF; --accent-soft:#DFE5FA;
  --ok:#1C7F4F; --ok-soft:#D6EFE2; --bad:#C2352E; --bad-soft:#F7DEDC; --warn:#A86A12;
  --key-w:#FFFFFF; --key-w-edge:#B9C3BC; --key-b:#151B24;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#10151C; --surface:#18202A; --sunk:#131A22; --ink:#E6ECF2; --muted:#9AA7B6; --line:#2A3542;
  --accent:#8EA2FF; --accent-ink:#0C1222; --accent-soft:#1E2A4C;
  --ok:#52C98F; --ok-soft:#173A2A; --bad:#FF7A70; --bad-soft:#47201E; --warn:#E6A94A;
  --key-w:#DCE3EA; --key-w-edge:#7D8894; --key-b:#06090D; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#10151C; --surface:#18202A; --sunk:#131A22; --ink:#E6ECF2; --muted:#9AA7B6; --line:#2A3542;
  --accent:#8EA2FF; --accent-ink:#0C1222; --accent-soft:#1E2A4C;
  --ok:#52C98F; --ok-soft:#173A2A; --bad:#FF7A70; --bad-soft:#47201E; --warn:#E6A94A;
  --key-w:#DCE3EA; --key-w-edge:#7D8894; --key-b:#06090D; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:24px 48px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font:700 1.55rem/1.05 var(--f-display);letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:.86rem}
.mods{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.mod{width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:var(--r);padding:9px 12px;cursor:pointer;display:grid;gap:1px}
.mod:hover{background:var(--sunk)}
.mod .t{font-weight:700}
.mod .s{font:500 .72rem/1.3 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.mod[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.mod[aria-current="true"] .s{color:var(--accent)}
.railnote{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

main{min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
.head > div{min-width:0}
.eyebrow{font:500 .75rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1{font:700 clamp(1.7rem,3.6vw,2.35rem)/1.05 var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.desc{margin:6px 0 0;color:var(--muted);max-width:62ch}
.headctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.seg button{border:0;background:none;border-radius:999px;min-width:34px;height:32px;padding:0 10px;cursor:pointer;font-family:var(--f-mono);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg .lab{font:500 .72rem/32px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 8px 0 10px}
.seg{flex-wrap:wrap;border-radius:18px}
.seg button{font-family:var(--f-body);font-weight:700;font-size:.88rem;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button.empty{color:var(--muted);font-weight:400;font-style:italic}
.seg .mod-tag{font:500 .72rem/32px var(--f-mono);color:var(--warn);padding:0 10px}
.slotbar{grid-column:1/-1;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.slotbar .copybox{flex:1 1 100%}
.slotbar > p{margin:0;flex:1 1 100%;min-width:0}
.slotbar input[type=text]{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);width:14em;max-width:100%}
.copybox{width:100%;font:500 .75rem var(--f-mono);border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper)}
.tally{font:500 .85rem/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);padding:9px 12px;border-radius:999px;background:var(--sunk)}
.tally b{color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:700;font-size:.93rem;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.quiet{background:none}
.btn .ic{font-size:.8em}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.btn.toggle .sw{width:28px;height:16px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;transition:background .15s}
.btn.toggle .sw::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);transition:left .15s}
.btn.toggle .sw.on{background:var(--accent)}.btn.toggle .sw.on::after{left:14px}
.micchip{font:500 .85rem/1 var(--f-mono);padding:8px 12px;border-radius:999px;background:var(--sunk);color:var(--ink);font-variant-numeric:tabular-nums;align-self:center}
.micchip.ok{background:var(--ok-soft);color:var(--ok)}.micchip.bad{background:var(--bad-soft);color:var(--bad)}
.btn .x{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.7rem;line-height:1;margin-left:2px}

.settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px 26px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field.wide{grid-column:1/-1}
.sech{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
.sech h3{margin:0;font:700 1rem/1.2 var(--f-display)}
.slotbar + .sech{border-top:0;padding-top:0;margin-top:0}
.field > .fl{font:500 .72rem/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 8px;cursor:pointer;font-size:.88rem;background:var(--paper)}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chk input{accent-color:var(--accent);margin:0}
select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper);max-width:100%}
input[type=range]{accent-color:var(--accent);width:100%}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.hint kbd,.kbd{font:500 .78rem var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.subh{font:500 .7rem/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}

.stand{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 10px;display:flex;flex-direction:column;gap:6px}
.countin{position:absolute;z-index:3;top:10px;right:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--accent);border-radius:999px;padding:6px 14px 6px 12px;box-shadow:0 4px 18px rgb(0 0 0/.12);max-width:calc(100% - 24px)}
.countin .cl{font:500 .72rem/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.countin i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 1.05rem/1 var(--f-display);background:var(--sunk);color:var(--muted)}
.countin i.on{background:var(--accent);color:var(--accent-ink)}
.countin i.done{background:var(--accent-soft);color:var(--accent)}
.countin .go{font:700 1.1rem/1 var(--f-display);color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 .8rem/1.3 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.meta span b{color:var(--ink);font-weight:500}
.staff{color:var(--ink);min-height:110px;overflow-x:auto}
.staff svg{display:block}
.staff.single{display:flex;justify-content:center}
.accrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.accrow .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.staff .abcjs-lyric{fill:var(--muted)}
.staff .is-now,.staff .is-now *{fill:var(--accent)!important;stroke:var(--accent)}
.staff .is-ok,.staff .is-ok *{fill:var(--ok)!important;stroke:var(--ok)}
.staff .is-bad,.staff .is-bad *{fill:var(--bad)!important;stroke:var(--bad)}
.staff .is-late,.staff .is-late *{fill:var(--warn)!important;stroke:var(--warn)}
.nolib{padding:20px;color:var(--bad)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.toolbar .sep{flex:1 1 0}
.mnav{display:inline-flex;gap:4px;align-items:center}
.btn.sq{padding:8px 12px;font-size:1.1rem;line-height:1}

.answer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.answer h2{font:700 1.05rem/1.2 var(--f-display);margin:0}
.ahead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-items:center}
.chip{font:500 .9rem/1 var(--f-mono);padding:7px 10px;border-radius:7px;background:var(--sunk);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chips .empty{color:var(--muted);font-size:.88rem}

.pianowrap{overflow-x:auto;padding-bottom:4px}
.piano{display:flex;height:130px;min-width:min-content;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wk{position:relative;flex:1 0 30px;min-width:30px;max-width:52px;background:var(--key-w);border:1px solid var(--key-w-edge);border-left-width:0;border-radius:0 0 6px 6px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.wk:first-child{border-left-width:1px}
.wk .lbl{font:500 .66rem/1 var(--f-mono);color:#5A6472;pointer-events:none}
.wk .lbl.c{color:#17212E;font-weight:700}
.bk{position:absolute;z-index:2;top:-1px;right:-30%;width:60%;height:60%;background:var(--key-b);border-radius:0 0 4px 4px;cursor:pointer}
.wk.f-on,.bk.f-on{background:var(--accent)}
.wk.f-ok,.bk.f-ok{background:var(--ok)}
.wk.f-bad,.bk.f-bad{background:var(--bad)}
.wk.f-on .lbl,.wk.f-ok .lbl,.wk.f-bad .lbl{color:#fff}

.names{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.name{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:14px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 1.15rem/1 var(--f-display)}
.name small{font:500 .7rem/1 var(--f-mono);color:var(--muted)}
.name:hover{border-color:var(--accent)}
.name.f-bad{background:var(--bad-soft);border-color:var(--bad)}
.name.f-ok{background:var(--ok-soft);border-color:var(--ok)}

.palette{display:flex;flex-wrap:wrap;gap:8px}
.fig{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:4px 8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;min-width:74px;color:var(--ink)}
.fig:hover:not(:disabled){border-color:var(--accent)}
.fig:disabled{opacity:.35;cursor:not-allowed}
.fig .gl{height:46px;width:70px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fig .gl svg{max-height:46px}
.fig small{font-size:.7rem;color:var(--muted);text-align:center;line-height:1.15;max-width:84px}

.pad{border:2px dashed var(--line);border-radius:16px;background:var(--paper);min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:background .08s}
.pad b{font:700 1.4rem/1 var(--f-display)}
.pad span{color:var(--muted);font-size:.88rem}
.pad.live{border-style:solid;border-color:var(--accent)}
.pad.hit{background:var(--accent-soft)}
.beatdots{display:flex;gap:8px;min-height:14px}
.beatdots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.beatdots i.on{background:var(--accent)}

.selfeval{display:flex;flex-wrap:wrap;gap:8px}
.progress{font:500 .9rem/1.3 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}
.progress b{color:var(--ink)}

.feedback{margin:0;padding:12px 16px;border-radius:10px;font-weight:700;background:var(--sunk)}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback:empty{display:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px;padding-inline:16px;padding-block:16px 40px}
  .rail{position:static;gap:12px}
  .mods{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .mod{width:auto;flex:0 0 auto;padding:7px 11px}
  .mod[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .railnote{display:none}
}
@media (max-width:520px){
  .names{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stand{padding:12px 10px 6px}
  .answer{padding:14px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Thème « studio bois » : mur crème, titres à empattements, vert sapin, piano en chêne ===== */
:root{
  --paper:#F4EFE8; --surface:#FFFDF9; --sunk:#EFE8DD; --ink:#1F2B28; --muted:#6A706B; --line:#E4DACB;
  --accent:#2F5B53; --accent-ink:#FFFFFF; --accent-soft:#E2ECE8; --accent-hi:#3A6D63;
  --ok:#2E7A4E; --ok-soft:#DFF0E4; --bad:#B8402F; --bad-soft:#F6E0DA; --warn:#A8670F;
  --btn:#FBF7F1; --btn-edge:#E3D8C8;
  --shadow:0 1px 2px rgb(60 45 30/.06),0 10px 28px rgb(60 45 30/.08);
  --shadow-sm:0 1px 1px rgb(60 45 30/.05),0 3px 8px rgb(60 45 30/.06);
  --wall:radial-gradient(1200px 520px at 85% -10%,#FFFFFF 0%,rgb(255 255 255/0) 60%),linear-gradient(180deg,#F8F4EE,#F4EFE8);
  --oak-hi:#D2AE83; --oak:#B98D60; --oak-lo:#94683F; --gutter:#3B2A1C;
  --ivory:#FBF8F1; --ivory2:#EFE9DD; --ivory-edge:#D7CDBD; --ivory-lip:#E4DCCD;
  --ebony:#2A2A2C; --ebony2:#4A4A4E;
  --f-display:"Lora","Georgia","Times New Roman",serif;
  --strip:linear-gradient(180deg,#FFFFFF,rgb(255 255 255/0));
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15130F; --surface:#1E1B16; --sunk:#262219; --ink:#ECE6DC; --muted:#A79F93; --line:#3A3329;
  --accent:#86C3B4; --accent-ink:#10201C; --accent-soft:#1F332E; --accent-hi:#9BD3C5;
  --ok:#62C98E; --ok-soft:#18362A; --bad:#FF8A78; --bad-soft:#45221C; --warn:#E6A94A;
  --btn:#25211B; --btn-edge:#3A3329;
  --shadow:0 1px 2px rgb(0 0 0/.35),0 10px 28px rgb(0 0 0/.3); --shadow-sm:0 1px 2px rgb(0 0 0/.35);
  --wall:radial-gradient(1200px 520px at 85% -10%,#2A251E 0%,rgb(42 37 30/0) 60%),linear-gradient(180deg,#1A1712,#15130F);
  --oak-hi:#8A6845; --oak:#6E5134; --oak-lo:#523B25; --gutter:#120C07;
  --ivory:#E9E3D7; --ivory2:#D6CFC1; --ivory-edge:#8F877A; --ivory-lip:#BDB5A7; --strip:linear-gradient(180deg,rgb(255 255 255/.035),rgb(255 255 255/0)); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#15130F; --surface:#1E1B16; --sunk:#262219; --ink:#ECE6DC; --muted:#A79F93; --line:#3A3329;
  --accent:#86C3B4; --accent-ink:#10201C; --accent-soft:#1F332E; --accent-hi:#9BD3C5;
  --ok:#62C98E; --ok-soft:#18362A; --bad:#FF8A78; --bad-soft:#45221C; --warn:#E6A94A;
  --btn:#25211B; --btn-edge:#3A3329;
  --shadow:0 1px 2px rgb(0 0 0/.35),0 10px 28px rgb(0 0 0/.3); --shadow-sm:0 1px 2px rgb(0 0 0/.35);
  --wall:radial-gradient(1200px 520px at 85% -10%,#2A251E 0%,rgb(42 37 30/0) 60%),linear-gradient(180deg,#1A1712,#15130F);
  --oak-hi:#8A6845; --oak:#6E5134; --oak-lo:#523B25; --gutter:#120C07;
  --ivory:#E9E3D7; --ivory2:#D6CFC1; --ivory-edge:#8F877A; --ivory-lip:#BDB5A7; --strip:linear-gradient(180deg,rgb(255 255 255/.035),rgb(255 255 255/0)); color-scheme:dark }

body{background-color:var(--paper);background-image:var(--wall);background-repeat:no-repeat;background-size:100% 1100px}

/* rail */
.brand{flex-direction:row;align-items:center;gap:12px}
.brand img{width:46px;height:46px;border-radius:12px;box-shadow:var(--shadow-sm);flex:0 0 auto}
.brand > div{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand b{font:700 1.4rem/1.05 var(--f-display);letter-spacing:0}
.brand span{font-size:.8rem;line-height:1.25}
.mods{gap:4px}
.mod{border-radius:12px;padding:10px 14px}
.mod .s{color:var(--muted)}
.mod:hover{background:rgb(255 255 255/.55)}
.mod[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow-sm),inset 3px 0 0 var(--accent)}
.railnote{border-color:var(--line)}

/* en-tête */
.head{padding-top:6px}
.eyebrow{color:var(--accent);letter-spacing:.1em}
h1{font:700 clamp(2rem,4vw,2.9rem)/1.05 var(--f-display);letter-spacing:-.01em;color:var(--ink)}
.desc{font-size:1.04rem;margin-top:8px;max-width:58ch}
.seg{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow-sm)}
.tally{background:var(--surface);border:1px solid var(--line)}

/* boutons */
.btn{background:var(--btn);border:1px solid var(--btn-edge);padding:10px 18px;font-size:.95rem;box-shadow:var(--shadow-sm);transition:transform .08s,box-shadow .15s,border-color .15s,background .15s}
.btn:hover{border-color:var(--accent);background:var(--surface)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 0 rgb(255 255 255/.15) inset,0 6px 16px rgb(47 91 83/.28)}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.quiet{background:var(--btn)}
.btn.sq{padding:10px 14px}
.btn:disabled{box-shadow:none;background:transparent}
.btn.toggle .sw.on{background:var(--accent)}
.micchip{background:var(--surface);border:1px solid var(--line)}

/* cartes */
.stand,.answer,.settings{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.stand{padding:0 22px 14px;gap:10px}
.answer{padding:20px 22px}
.answer h2,.sech h3{font-family:var(--f-display)}
.feedback{border-radius:14px}
.name,.fig,.pad,.chk,select,.slotbar input[type=text]{background:var(--btn)}
.chip{background:var(--btn)}

/* bande d'infos de l'exercice (dans la carte de la partition) */
.stand .meta{display:flex;flex-wrap:wrap;gap:0;margin:0 -22px;padding:4px 10px;border-bottom:1px solid var(--line);
  background:var(--strip);border-radius:18px 18px 0 0;font:400 .78rem/1.2 var(--f-body);color:var(--muted)}
.stand .meta .mi{display:flex;align-items:center;padding:10px 20px;position:relative}
.stand .meta .mi + .mi::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:1px;background:var(--line)}
.stand .meta .mi .ico{width:22px;height:22px;display:grid;place-items:center;color:var(--ink);flex:0 0 auto;font:400 1.35rem/1 "Noto Music","Apple Symbols","Segoe UI Symbol",serif}
.stand .meta .mi .ico svg{width:20px;height:20px}
.stand .meta .mi > span{display:flex;flex-direction:column;gap:2px}
.stand .meta .mi b{font:700 .98rem/1.2 var(--f-body);color:var(--ink)}
.staff:not(.single){min-height:0}
.staff{margin:20px 0}
.stand .meta .mi b .q{font:400 1.1em/1 "Apple Symbols","Noto Music","Segoe UI Symbol",serif}

/* piano en chêne */
.pianowrap{padding:12px 14px 22px;border-radius:14px;
  background:linear-gradient(180deg,var(--oak-hi),var(--oak) 40%,var(--oak-lo));
  box-shadow:inset 0 1px 0 rgb(255 255 255/.35),inset 0 -4px 10px rgb(0 0 0/.18),0 12px 24px rgb(80 55 30/.18)}
.piano{height:172px;padding:8px 6px 0;background:var(--gutter);border-radius:6px;box-shadow:inset 0 4px 8px rgb(0 0 0/.55)}
.wk{max-width:60px;margin-right:2px;border:0;border-radius:0 0 9px 9px;
  background:linear-gradient(180deg,var(--ivory2) 0%,var(--ivory) 14%,var(--ivory) 84%,var(--ivory2) 100%);
  box-shadow:inset 0 -9px 0 var(--ivory-lip),inset 0 -10px 0 var(--ivory-edge),0 2px 0 rgb(0 0 0/.25);padding-bottom:18px}
.wk:last-child{margin-right:0}
.wk:first-child{border-left-width:0}
.wk .lbl{font:400 .88rem/1 var(--f-body);color:#5E574C}
.wk .lbl.c{color:#1F2B28;font-weight:700}
.bk{width:62%;right:calc(-31% - 1px);height:60%;top:-1px;border-radius:0 0 7px 7px;
  background:linear-gradient(180deg,var(--ebony2) 0%,var(--ebony) 30%,#151517 100%);
  box-shadow:inset 0 -7px 0 #111,inset 0 -8px 0 #3d3d40,inset 2px 0 0 rgb(255 255 255/.06),0 4px 5px rgb(0 0 0/.4)}
.wk:active{background:linear-gradient(180deg,#E6DFD2,#F3EEE5)}
.wk.f-on,.bk.f-on{background:var(--accent);box-shadow:inset 0 -6px 0 rgb(0 0 0/.18)}
.wk.f-ok,.bk.f-ok{background:var(--ok)}
.wk.f-bad,.bk.f-bad{background:var(--bad)}
.wk.f-on .lbl,.wk.f-ok .lbl,.wk.f-bad .lbl{color:#fff}

.pad{border-color:var(--btn-edge)}
.pad.live{border-color:var(--accent)}
.beatdots i.on,.countin i.on{background:var(--accent)}

@media (max-width:860px){
  .brand img{width:40px;height:40px}
  .mod{white-space:nowrap}
  .stand .meta .mi{padding:8px 12px}
}
@media (max-width:520px){
  .pianowrap{padding:8px 8px 16px}
  .piano{height:140px}
  .stand{padding:0 12px 8px}
  .stand .meta{margin:0 -12px}
  .stand .meta .mi + .mi::before{display:none}
}

/* barre de boutons : une seule ligne centrée, trois groupes séparés par un trait fin
   actions principales | écoute (+ ■ Arrêter) | outils */
#toolbar{justify-content:center;align-items:center;padding:10px 12px;border-radius:999px;
  background:rgb(255 255 255/.45);border:1px solid var(--line)}
:root[data-theme="dark"] #toolbar{background:rgb(255 255 255/.03)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #toolbar{background:rgb(255 255 255/.03)}}
#toolbar .tgrow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 0;width:100%}
#toolbar .tg{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:0 9px}
#toolbar .tg + .tg{border-left:1px solid var(--line)}
#toolbar .tg.tools:not(:has(> :not([hidden]))){display:none}
#toolbar .btn{padding:7px 12px;font-size:.87rem;gap:6px}
#toolbar .btn.sq{padding:8px 10px}
#toolbar .tg.tools .btn{box-shadow:none}
#toolbar .micchip{font-size:.8rem;padding:7px 10px}
.toolbar .sep{display:none}
#toolbar [data-stop]{font-size:0;gap:0;width:38px;height:38px;padding:0;justify-content:center;border-radius:50%}
#toolbar [data-stop] .ic{font-size:15px;line-height:1}
#toolbar [data-stop]:not(:disabled){color:var(--bad);border-color:var(--bad)}
.answer .toolbar{justify-content:center}
@media (max-width:760px){#toolbar{padding:10px;border-radius:18px}#toolbar .tg + .tg{border-left:0}}

/* bouton Réglages : au bout de la bande d'infos, dans la carte de la partition */
.stand > #setbtn{position:absolute;top:12px;right:16px;z-index:2}
.stand .meta{padding-right:150px}
/* panneau Réglages : tiroir qui s'ouvre sous la bande d'infos */
.stand > .settings{margin:0 -22px;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;background:var(--paper);padding:18px 22px}
.settings > #levels{grid-column:1/-1;justify-self:start}
@media (max-width:520px){.stand > .settings{margin:0 -12px;padding:14px 12px}.stand .meta{padding-right:10px;padding-top:52px}}

/* compteur de réussites : petite pastille en bas à gauche de la carte de la partition */
.stand .tallyrow{position:absolute;left:22px;bottom:12px;display:flex}
.stand{padding-bottom:0}
.stand .tallyrow .tally{font-size:.78rem;padding:5px 12px;background:var(--paper);border:1px solid var(--line)}

/* ===== volet théorique : groupes du menu, intervalles, progressions, bibliothèque, mode aide ===== */
.mods .modgroup{font:500 .68rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 14px 4px}
.mods .modgroup:first-child{padding-top:2px}
.mod.modlib .t{font-family:var(--f-display)}
.head{align-items:flex-start}
.helpbtn{align-self:flex-start;gap:8px}
.helpbtn .q{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 .78rem/1 var(--f-body)}
.helpbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.helpbtn[aria-pressed="true"] .q{background:var(--accent-ink);color:var(--accent)}
body.helpmode main{cursor:help}
body.helpmode main *{cursor:help!important}
.helpbox{position:fixed;z-index:50;pointer-events:none;border:2px dashed var(--accent);border-radius:10px;background:color-mix(in srgb,var(--accent) 7%,transparent);transition:all .08s}
.helpbox .hb-tag{position:absolute;left:-2px;top:-26px;white-space:nowrap;background:var(--accent);color:var(--accent-ink);font:700 .75rem/1 var(--f-body);padding:5px 9px;border-radius:8px}
.helpwrap{position:relative;align-self:flex-start}
.helpbar{position:absolute;z-index:51;right:0;top:calc(100% + 12px);width:max-content;max-width:260px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:14px;box-shadow:var(--shadow);font:700 .92rem/1.35 var(--f-body);animation:hbpop .18s ease-out}
.helpbar::before{content:"";position:absolute;top:-7px;right:28px;width:14px;height:14px;background:var(--ink);transform:rotate(45deg);border-radius:2px}
.helpbar .btn{padding:5px 11px;font-size:.8rem;background:transparent;color:var(--paper);border-color:rgb(255 255 255/.35);box-shadow:none}
@media (max-width:860px){.helpbar{right:auto;left:0}.helpbar::before{right:auto;left:28px}}
@keyframes hbpop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.helpbar{animation:none}}

/* intervalles */
.ivgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.ivbtn,.chbtn{border:1px solid var(--btn-edge);background:var(--btn);border-radius:14px;padding:12px 8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);box-shadow:var(--shadow-sm)}
.ivbtn b{font:700 1.25rem/1 var(--f-display)}
.ivbtn small,.chbtn small{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.2}
.ivbtn:hover,.chbtn:hover{border-color:var(--accent)}
.ivbtn.f-ok,.chbtn.f-ok{background:var(--ok-soft);border-color:var(--ok)}
.ivbtn.f-bad,.chbtn.f-bad{background:var(--bad-soft);border-color:var(--bad)}

/* progressions */
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{min-width:72px;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.slot small{font:500 .7rem/1 var(--f-mono);color:var(--muted)}
.slot b{font:700 1.35rem/1.1 var(--f-display)}
.slot em{font-style:normal;font-size:.8rem;color:var(--ok);font-weight:700}
.slot.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.slot.given{background:var(--sunk)}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}
.slot.bad{border-color:var(--bad);background:var(--bad-soft)}
.slot.bad b{color:var(--bad);text-decoration:line-through}
.slot.playing{outline:3px solid var(--accent);outline-offset:2px}
.chpad{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.chbtn b{font:700 1.3rem/1 var(--f-display)}
.invrow:empty{display:none}
.plays:empty{display:none}

/* bibliothèque */
main[data-kind="lib"] > .stand,main[data-kind="lib"] > #toolbar,main[data-kind="lib"] > #feedback,main[data-kind="lib"] > #answer{display:none}
main:not([data-kind="lib"]) > .library{display:none}
.library{display:flex;flex-direction:column;gap:14px}
.libtop{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.libback:empty{display:none}
.libsearch{flex:1 1 260px;min-width:0;border:1px solid var(--line);border-radius:999px;padding:11px 18px;background:var(--surface);box-shadow:var(--shadow-sm);font-size:1rem}
.libsearch:focus{outline:2px solid var(--accent);outline-offset:1px}
.libcats{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border-radius:18px;background:rgb(255 255 255/.45);border:1px solid var(--line)}
.libcat{border:0;background:none;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted)}
.libcat:hover{color:var(--ink)}
.libcat[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.libsubs{display:flex;flex-wrap:wrap;gap:6px}
.libsubs:empty{display:none}
.libsub{border:1px solid var(--btn-edge);background:var(--btn);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.88rem;color:var(--ink)}
.libsub:hover{border-color:var(--accent)}
.libsub[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.libart{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 26px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.libart h2{font:700 clamp(1.4rem,2.6vw,1.9rem)/1.15 var(--f-display);margin:0}
.libart .eyebrow{margin:0}
.libhtml{max-width:72ch;line-height:1.6}
.libhtml p{margin:.5em 0}
.libhtml ul,.libhtml ol{margin:.4em 0;padding-left:1.3em}
.libhtml li{margin:.25em 0}
.libhtml a{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.libhtml .formula{font:700 1.05rem/1.6 var(--f-mono);background:var(--sunk);border-radius:10px;padding:8px 14px;display:inline-block}
.lt{border-collapse:collapse;margin:.6em 0;font-size:.92rem;max-width:100%;display:block;overflow-x:auto}
.lt th,.lt td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.lt th{background:var(--sunk);font-weight:700}
.lexs{display:flex;flex-direction:column;gap:14px}
.lex{margin:0;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:12px 14px 10px;display:flex;flex-direction:column;gap:6px}
.lexstaff{color:var(--ink);overflow-x:auto}
.lexbar{display:flex;gap:8px;align-items:center}
.lexbar:empty{display:none}
.lexbar .btn{padding:6px 12px;font-size:.85rem}
.lexbar [data-stop]{font-size:0;gap:0;width:34px;height:34px;padding:0;justify-content:center;border-radius:50%}
.lexbar [data-stop] .ic{font-size:13px}
.lexcap{margin:0;font-size:.85rem;color:var(--muted)}
.libsee{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.libchip{cursor:pointer;font:500 .85rem/1 var(--f-body);padding:7px 11px}
.libchip:hover{border-color:var(--accent)}
.libnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.libnav .btn{max-width:48%;white-space:normal;text-align:left}
.libhits{display:flex;flex-direction:column;gap:8px}
.libhit{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink)}
.libhit:hover{border-color:var(--accent)}
.libhit small{font:500 .68rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.libhit span{font-size:.85rem;color:var(--muted)}
.libart [data-piano] .pianowrap{margin-top:8px}
@media (max-width:860px){.mods .modgroup{display:none}}
@media (max-width:520px){.libart{padding:16px 14px}.libnav .btn{max-width:100%}.ivgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}}

/* progressions : choix de réponse et accords à réécouter */
.pcopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pcopt{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--btn-edge);background:var(--btn);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow-sm)}
.pcopt small{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font:500 .75rem/1 var(--f-mono);color:var(--muted);flex:0 0 auto}
.pcopt b{font:700 1.15rem/1.2 var(--f-display);letter-spacing:.01em}
.pcopt:hover{border-color:var(--accent)}
.pcopt.f-ok{background:var(--ok-soft);border-color:var(--ok)}
.pcopt.f-bad{background:var(--bad-soft);border-color:var(--bad)}
.pcopt.dim{opacity:.5}
.pcafter:empty{display:none}
.pcafter{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:14px}
.pcchords{display:flex;flex-wrap:wrap;gap:8px}
.pcchord{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:96px;border:1px solid var(--btn-edge);background:var(--btn);border-radius:14px;padding:8px 12px 10px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow-sm)}
.pcchord small{font:500 .68rem/1 var(--f-mono);color:var(--muted)}
.pcchord b{font:700 1.2rem/1.1 var(--f-display)}
.pcchord span{font-size:.75rem;color:var(--muted)}
.pcchord:hover{border-color:var(--accent)}
.pcchord.playing{outline:3px solid var(--accent);outline-offset:2px}

/* méthode de travail : volet repliable au bas des modules */
.method{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm)}
.method > summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding:16px 22px;font:700 1.05rem/1.2 var(--f-display)}
.method > summary::-webkit-details-marker{display:none}
.method > summary::after{content:"＋";margin-left:auto;font:400 1.1rem/1 var(--f-body);color:var(--muted)}
.method[open] > summary::after{content:"−"}
.method .methic{color:var(--accent)}
.method .methsub{font:400 .82rem/1.2 var(--f-body);color:var(--muted)}
.methbody{padding:0 22px 18px;max-width:78ch;line-height:1.6}
.methbody ol,.methbody ul{margin:.2em 0 .6em;padding-left:1.3em}
.methbody li{margin:.3em 0}
.methbody p{margin:.5em 0}
main[data-kind="lib"] > .method{display:none}

/* annotations visuelles de la bibliothèque */
.lexstaff .lx-circle{fill:none;stroke:var(--accent);stroke-width:2.2}
.lexstaff .lx-alt,.lexstaff .lx-alt *{fill:var(--bad)!important;stroke:var(--bad)}
.lexstaff .lx-span{fill:none;stroke:var(--bad);stroke-width:1.4}
.lexstaff .lx-spantext{fill:var(--bad);font:700 11px var(--f-body)}
.lxstep{margin:6px 0 -4px;font-size:1rem}
.lxarrow{display:flex;align-items:center;gap:12px;margin:-2px 0 -2px 18px}
.lxarrow-ic{font:700 1.9rem/1 var(--f-body);color:var(--accent)}
.lxarrow-t{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:7px 12px;font-size:.92rem}
.lxtip{background:var(--accent-soft);border-radius:12px;padding:8px 12px}

/* truc des deux rangées */
.trick-static{display:flex;flex-direction:column;gap:6px;margin:.6em 0;font:700 1.05rem/1.2 var(--f-body)}
.tsrow{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:flex-end}
.tsrow > span{display:inline-flex;flex-direction:column;align-items:center;min-width:42px}
.tsrow i{font:500 .85rem/1.2 var(--f-mono);color:var(--accent);font-style:normal}
.tsrow .tslab{min-width:84px;align-items:flex-start;font:500 .72rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:20px}
.armtrick{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.atrow{display:grid;grid-template-columns:92px repeat(7,minmax(0,1fr));gap:6px;align-items:stretch}
.atlab{align-self:center;font:500 .72rem/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.attile{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--btn-edge);background:var(--surface);border-radius:12px;padding:6px 2px 8px;cursor:pointer;color:var(--ink);min-width:0}
.attile .atnote{font-size:.68rem;color:var(--muted);visibility:hidden}
.attile b{font:700 1.05rem/1.1 var(--f-display)}
.attile i{font:500 .8rem/1 var(--f-mono);color:var(--accent);font-style:normal}
.attile:hover{border-color:var(--accent)}
.attile.alt{background:var(--bad-soft);border-color:var(--bad)}
.attile.alt .atnote{visibility:visible;color:var(--bad);font-weight:700}
.attile.sel{outline:3px solid var(--accent);outline-offset:1px}
.atinfo{font-size:.98rem;line-height:1.5}
.atinfo span{color:var(--muted)}
.atstaff .lex{background:var(--surface)}
@media (max-width:620px){.tsrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}.tsrow > span{min-width:0;font-size:.9rem}.tsrow .tslab{grid-column:1/-1;padding:4px 0 2px}.atrow{grid-template-columns:repeat(7,minmax(0,1fr))}.atlab{grid-column:1/-1}.attile b{font-size:.9rem}}

/* éditeur de notation des dictées */
.edbox{display:flex;flex-direction:column;gap:12px}
.edpal{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.edgrp{display:flex;gap:6px;padding:6px;border-radius:16px;background:var(--paper);border:1px solid var(--line)}
.edbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:62px;border:1px solid transparent;background:transparent;border-radius:12px;padding:4px 8px 6px;cursor:pointer;color:var(--ink)}
.edbtn .gl{height:40px;width:44px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.edbtn .gl svg{max-height:40px}
.edbtn b{font:700 1.4rem/40px var(--f-body);height:40px}
.edbtn small{font-size:.7rem;color:var(--muted)}
.edbtn:hover{background:var(--surface);border-color:var(--btn-edge)}
.edbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.edbtn[aria-pressed="true"] small{color:var(--accent-ink)}
.edwrap{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:6px 12px}
.edstaff{min-height:120px;cursor:crosshair}
.edstaff.edhot{outline:none}
.edstaff .edghost{fill:var(--accent);opacity:.45;pointer-events:none}
.edtag{position:absolute;pointer-events:none;background:var(--accent);color:var(--accent-ink);font:700 .78rem/1 var(--f-body);padding:4px 7px;border-radius:7px;white-space:nowrap}
.edinfo{margin:0;font-size:.88rem;color:var(--muted)}
.edpiano > summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted);padding:4px 0}
.edpiano[open] > summary{margin-bottom:8px}
@media (max-width:620px){.edbtn{min-width:48px;padding:4px 4px 6px}.edbtn small{font-size:.62rem}}

/* ===== mobile (≤ 600 px) : boutons en grille, bibliothèque en rangées défilantes ===== */
:root[data-theme="dark"] .libcats{background:rgb(255 255 255/.03)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .libcats{background:rgb(255 255 255/.03)}}
@media (max-width:600px){
  #toolbar{padding:12px;border-radius:22px}
  #toolbar .tgrow{flex-direction:column;align-items:stretch;gap:10px}
  #toolbar .tg{display:flex;flex-wrap:wrap;gap:8px;padding:0;justify-content:stretch;align-items:stretch}
  #toolbar .tg + .tg{border-left:0;border-top:1px solid var(--line);padding-top:10px}
  #toolbar .tg > *{flex:1 1 calc(50% - 4px);min-width:0}
  #toolbar .btn{justify-content:center;min-height:46px;padding:10px 12px;font-size:.93rem}
  #toolbar .btn.primary{min-height:50px;font-size:1rem}
  #toolbar .mnav{flex:1 1 calc(100% - 54px);display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:6px}
  #toolbar .mnav .btn{width:100%;padding-inline:6px}
  #toolbar .tg.listen > .btn{flex-basis:calc(50% - 31px);white-space:normal;line-height:1.15}
  #toolbar .tg > .btn[data-stop]{flex:0 0 46px;width:46px;height:46px;min-height:46px;font-size:0;padding:0}
  #toolbar .micchip{flex-basis:100%;text-align:center;justify-content:center}

  .libtop{gap:8px}
  .libsearch{padding:10px 16px;font-size:16px}
  .libcats,.libsubs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;scroll-padding-inline:12px;margin-inline:-4px}
  .libcats::-webkit-scrollbar,.libsubs::-webkit-scrollbar{display:none}
  .libcats > *,.libsubs > *{flex:0 0 auto;scroll-snap-align:start;white-space:nowrap}
  .libcats{border-radius:999px;padding:5px;gap:2px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}
  .libcats::after{content:"";flex:0 0 14px}
  .libcat{padding:9px 14px;font-size:.95rem}
  .libsubs{padding:2px 4px 6px;gap:6px;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .libsubs::after{content:"";flex:0 0 18px}
  .libsub{padding:8px 14px;font-size:.92rem}
  .libart{padding:18px 16px 16px;border-radius:16px;gap:10px}
  .libart h2{font-size:1.45rem}
  .libhtml{font-size:1rem;line-height:1.55}
  .lex{padding:10px 10px 8px;border-radius:12px}
  .lexbar{flex-wrap:wrap}
  .libnav{flex-direction:column}
  .libnav .btn{max-width:100%;width:100%;justify-content:space-between}
  .libsee{gap:6px}
}

/* ===== mobile : menu déroulant des modules ===== */
.modpick{display:none}
@media (max-width:600px){
  .rail .mods{display:none}
  .modpick{display:flex;position:relative;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:10px 12px 10px 16px;box-shadow:var(--shadow-sm);box-shadow:inset 3px 0 0 var(--accent),var(--shadow-sm)}
  .modpick .mp-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .modpick .mp-g{font:500 .66rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .modpick .mp-t{font:700 1.1rem/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .modpick .mp-s{display:none;font:500 .7rem/1.2 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .modpick .mp-ic{flex:0 0 auto;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;
    background:var(--btn);border:1px solid var(--btn-edge);color:var(--ink);box-shadow:var(--shadow-sm)}
  .modpick .mp-ic svg{width:20px;height:20px}
  .modpick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer;-webkit-appearance:none;appearance:none}
  .modpick:has(select:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
}

/* ===== mobile : bande d'infos en grille, Réglages en bouton icône ===== */
.mi-set{display:none}
@media (max-width:600px){
  .stand > #setbtn{display:none}
  .stand .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 44px;column-gap:2px;align-items:start;padding:6px 8px 6px 0;padding-top:6px}
  .stand .meta .mi{padding:8px 2px 8px 10px;min-width:0}
  .stand .meta .mi > span{min-width:0}
  .stand .meta .mi b{overflow-wrap:anywhere;font-size:.9rem}
  .stand .meta .mi-set{display:flex;grid-column:4;grid-row:1 / span 6;align-self:center;justify-content:flex-end;padding:0}
  .mi-set button{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;cursor:pointer;
    background:var(--btn);border:1px solid var(--btn-edge);color:var(--ink);box-shadow:var(--shadow-sm);padding:0}
  .mi-set button svg{width:21px;height:21px}
  .mi-set button[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
}
</style>

<script>
'use strict';
/* ---------- utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const LEVELS=document.getElementById('levels'); /* choix De base / Sauvegardes : placé en tête du panneau Réglages */
function el(tag,props={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k==='class')e.className=v;else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function wpick(items,w){const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;for(let i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i];}return items[items.length-1];}
const mod7=n=>((n%7)+7)%7;

/* ---------- théorie ---------- */
const LET=['C','D','E','F','G','A','B'];
const FRN=['do','ré','mi','fa','sol','la','si'];
const PC=[0,2,4,5,7,9,11];
const FR_PC=['do','do♯','ré','ré♯','mi','fa','fa♯','sol','sol♯','la','la♯','si'];
const SHARPS=[3,0,4,1,5,2,6], FLATS=[6,2,5,1,4,0,3];
const KEYS={
  C:{abc:'C',fr:'Do majeur',t:0,sig:0},
  G:{abc:'G',fr:'Sol majeur',t:4,sig:1},
  D:{abc:'D',fr:'Ré majeur',t:1,sig:2},
  A:{abc:'A',fr:'La majeur',t:5,sig:3},
  F:{abc:'F',fr:'Fa majeur',t:3,sig:-1},
  Bb:{abc:'Bb',fr:'Si♭ majeur',t:6,sig:-2},
  Eb:{abc:'Eb',fr:'Mi♭ majeur',t:2,sig:-3},
  Am:{abc:'Am',fr:'La mineur',t:5,sig:0,minor:true},
  Em:{abc:'Em',fr:'Mi mineur',t:2,sig:1,minor:true},
  Dm:{abc:'Dm',fr:'Ré mineur',t:1,sig:-1,minor:true},
  Gm:{abc:'Gm',fr:'Sol mineur',t:4,sig:-2,minor:true},
};
function sigAlts(sig){const a=[0,0,0,0,0,0,0];if(sig>0)for(let i=0;i<sig;i++)a[SHARPS[i]]=1;else for(let i=0;i<-sig;i++)a[FLATS[i]]=-1;return a;}
function degInfo(key,clef,shift,deg){
  const li=key.t+deg, L=mod7(li), oct=(clef==='bass'?3:4)+shift+Math.floor(li/7);
  let alt=sigAlts(key.sig)[L]; if(key.minor&&mod7(deg)===6)alt+=1; // mineur harmonique
  return {L,oct,alt,midi:12*(oct+1)+PC[L]+alt};
}
function bestShift(key,clef,lo,hi){
  const [cl,ch]=clef==='bass'?[40,62]:[57,79]; let best=0,bp=1e9;
  for(const s of[0,-1,1]){const a=degInfo(key,clef,s,lo).midi,b=degInfo(key,clef,s,hi).midi;const p=Math.max(0,cl-a)+Math.max(0,b-ch);if(p<bp){bp=p;best=s;}}
  return best;
}
const noteName=n=>FRN[n.L]+(n.alt===1?'♯':n.alt===-1?'♭':'');

  '2/4':{label:'2/4',bu:4,beats:2},'3/4':{label:'3/4',bu:4,beats:3},'4/4':{label:'4/4',bu:4,beats:4},
  '6/8':{label:'6/8',bu:6,beats:2,comp:true},'9/8':{label:'9/8',bu:6,beats:3,comp:true},'12/8':{label:'12/8',bu:6,beats:4,comp:true},
};
/* figures : unités = double-croche ; négatif = silence ; span = nombre de temps */

  {id:'np',fr:'Noire pointée',comp:true,span:1,u:[6]},
