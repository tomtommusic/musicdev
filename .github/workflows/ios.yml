name: Verification iOS
on:
  push:
    paths: ['ios/**', 'index.html', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compiler pour le simulateur (sans signature)
        run: |
          set -o pipefail
          xcodebuild -version | tee ci.log
          xcodebuild -project ios/MusicDEV.xcodeproj -target MusicDEV -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build 2>&1 | tee -a ci.log | tail -40
          echo "RESULTAT: OK" >> ci.log
          ls -R build/Debug-iphonesimulator/MusicDEV.app | head -40 >> ci.log
          plutil -p build/Debug-iphonesimulator/MusicDEV.app/Info.plist >> ci.log
      - name: Fichier .ipa non signe (pour Sideloadly / AltStore)
        run: |
          set -o pipefail
          xcodebuild -project ios/MusicDEV.xcodeproj -target MusicDEV -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build 2>&1 | tail -5
          rm -rf Payload && mkdir Payload && cp -R build/Release-iphoneos/MusicDEV.app Payload/
          zip -qry MusicDEV-iOS.ipa Payload && ls -la MusicDEV-iOS.ipa >> ci.log
          lipo -info Payload/MusicDEV.app/MusicDEV >> ci.log
      - name: Lancer dans le simulateur et prendre une capture
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']][-1])")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/MusicDEV.app
          xcrun simctl privacy "$UDID" grant microphone ca.tomtommusic.musicdev || true
          xcrun simctl launch "$UDID" ca.tomtommusic.musicdev
          sleep 12
          xcrun simctl io "$UDID" screenshot shot.png
      - name: Publier le journal
        if: always()
        run: |
          [ -f ci.log ] || echo "pas de journal" > ci.log
          grep -q "RESULTAT: OK" ci.log || { echo "RESULTAT: ECHEC" >> ci.log; grep -E "error:|warning:" ci.log | head -60 >> ci.log || true; }
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-ios && git rm -rfq . && cp ci.log ci-ios.log 2>/dev/null || true
          git add ci-ios.log; [ -f shot.png ] && git add -f shot.png; [ -f MusicDEV-iOS.ipa ] && git add -f MusicDEV-iOS.ipa && git commit -qm "journal ${GITHUB_SHA}" && git push -f origin ci-ios
