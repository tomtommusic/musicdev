name: Verification iOS
on:
  push:
    paths: ['ios/**', 'index.html', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compiler pour le simulateur (sans signature)
        run: |
          set -o pipefail
          xcodebuild -version | tee ci.log
          xcodebuild -project ios/MusicDEV.xcodeproj -target MusicDEV -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build 2>&1 | tee -a ci.log | tail -40
          echo "RESULTAT: OK" >> ci.log
          ls -R build/Debug-iphonesimulator/MusicDEV.app | head -40 >> ci.log
          plutil -p build/Debug-iphonesimulator/MusicDEV.app/Info.plist >> ci.log
      - name: Publier le journal
        if: always()
        run: |
          [ -f ci.log ] || echo "pas de journal" > ci.log
          grep -q "RESULTAT: OK" ci.log || { echo "RESULTAT: ECHEC" >> ci.log; grep -E "error:|warning:" ci.log | head -60 >> ci.log || true; }
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-ios && git rm -rfq . && cp ci.log ci-ios.log 2>/dev/null || true
          git add ci-ios.log && git commit -qm "journal ${GITHUB_SHA}" && git push -f origin ci-ios
