name: Windows portable
# Lancement manuel. Fabrique MusiDev.exe (Windows, sans installation) avec Neutralinojs
# et publie MusiDev-Windows.zip sur la branche windows-build (à copier dans le dépôt tommusic-site).
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Préparer l'app
        run: |
          npm i -g @neutralinojs/neu
          cd desktop && rm -rf resources bin dist && mkdir resources
          cp ../index.html ../manifest.webmanifest ../abcjs-basic-min.js ../abcjs-basic-min.js.LICENSE resources/
          cp -r ../icons ../fonts resources/
          neu update
          neu build --release --embed-resources
          ls -la dist/MusiDev
      - name: Publier le ZIP sur la branche windows-build
        run: |
          mkdir -p z/MusiDev out && cp desktop/dist/MusiDev/MusiDev-win_x64.exe z/MusiDev/MusiDev.exe && cp desktop/LISEZ-MOI.txt z/MusiDev/
          (cd z && zip -qr -9 ../out/MusiDev-Windows.zip MusiDev)
          cd out && git init -q -b windows-build && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "windows ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" windows-build
