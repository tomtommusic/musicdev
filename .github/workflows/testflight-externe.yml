name: TestFlight externe
# Lancement manuel : met le dernier build dans le groupe externe « Testeurs » et le soumet à la révision bêta.
on:
  workflow_dispatch:
    inputs:
      feedback_email:
        description: "Courriel pour les commentaires des testeurs"
        required: false
        default: ""
      mode:
        description: "status = seulement lire l'état de la révision"
        required: false
        default: ""
      platform:
        description: "IOS ou MAC_OS"
        required: false
        default: "IOS"
      testers:
        description: "Courriels des testeurs à ajouter (séparés par des virgules)"
        required: false
        default: ""
      what_to_test:
        description: "Quoi tester (texte montré aux testeurs)"
        required: false
        default: ""
jobs:
  external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - name: Groupe externe et révision bêta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          FEEDBACK_EMAIL: ${{ github.event.inputs.feedback_email }}
          WHAT_TO_TEST: ${{ github.event.inputs.what_to_test }}
          ADD_TESTERS: ${{ github.event.inputs.testers }}
          MODE: ${{ github.event.inputs.mode }}
          PLATFORM: ${{ github.event.inputs.platform || 'IOS' }}
        run: python3 .github/scripts/asc_external.py
