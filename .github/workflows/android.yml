name: Android
# Lancement manuel. Construit l'app Android (APK de test), la lance dans un émulateur
# et prend des captures d'écran de quelques modules (on n'a pas d'appareil Android sous la main).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version affiché"
        required: false
        default: "1.0"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Construire l'APK de test
        working-directory: android
        env:
          VERSION_NAME: ${{ github.event.inputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set +e
          gradle --no-daemon assembleDebug 2>&1 | tee build.log; st=${PIPESTATUS[0]}
          if [ $st -ne 0 ]; then msg=$(grep -E "error:|What went wrong|e: |> |Could not|FAILED" -A2 build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=Gradle::$msg"; fi
          exit $st
      - name: Copier l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MusiDev-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MusiDev-android-apk
          path: MusiDev-test.apk
      - name: Activer KVM (émulateur rapide)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Essai dans l'émulateur et captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/android_shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MusiDev-android-captures
          path: shots/
