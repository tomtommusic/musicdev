name: Android
# Lancement manuel. Construit l'app Android (APK de test), la lance dans un émulateur
# et prend des captures d'écran de quelques modules (on n'a pas d'appareil Android sous la main).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version affiché"
        required: false
        default: "1.0"
      playstore:
        description: "oui = construire aussi le paquet signé pour Google Play (.aab)"
        required: false
        default: "non"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Construire l'APK de test
        working-directory: android
        env:
          VERSION_NAME: ${{ github.event.inputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set +e
          gradle --no-daemon assembleDebug 2>&1 | tee build.log; st=${PIPESTATUS[0]}
          if [ $st -ne 0 ]; then msg=$(grep -E "error:|What went wrong|e: |> |Could not|FAILED" -A2 build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=Gradle::$msg"; fi
          exit $st
      - name: Paquet signé pour Google Play
        if: github.event.inputs.playstore == 'oui'
        working-directory: android
        env:
          VERSION_NAME: ${{ github.event.inputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: musidev
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Secret ANDROID_KEYSTORE_B64 manquant (lance d'abord « Android - créer la clé »)."; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.p12"
          gradle --no-daemon bundleRelease
          mkdir -p ../aab && cp app/build/outputs/bundle/release/app-release.aab "../aab/MusiDev-${{ github.event.inputs.version }}-${{ github.run_number }}.aab"
          rm -f "$RUNNER_TEMP/upload.p12"
      - name: Publier le .aab sur la branche android-aab
        if: github.event.inputs.playstore == 'oui'
        run: |
          cd aab && git init -q -b android-aab && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "aab ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-aab
      - name: Copier l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MusiDev-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MusiDev-android-apk
          path: MusiDev-test.apk
      - name: Activer KVM (émulateur rapide)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Essai dans l'émulateur et captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/android_shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MusiDev-android-captures
          path: shots/
      - name: Publier les captures sur la branche android-captures
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots && git init -q -b android-captures && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "captures ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-captures
