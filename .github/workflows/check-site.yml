name: Vérifier tommusic.ca
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in tommusic.ca www.tommusic.ca; do
            A=$(dig +short $h | tr '\n' ' '); echo "::notice::DNS $h -> $A"
            C=$(echo | openssl s_client -servername $h -connect $h:443 2>/dev/null | openssl x509 -noout -subject -issuer -enddate 2>/dev/null | tr '\n' ' ')
            echo "::notice::CERT $h -> $C"
            S=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" https://$h/ || true); echo "::notice::HTTPS $h -> $S"
            S=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" http://$h/ || true); echo "::notice::HTTP $h -> $S"
          done
