    last?(review?null:btn('Terminer et voir mon résultat',()=>qzFinish(),'primary')):btn('Suivante ›',()=>qzGo(i+1),'primary'));
  const conf=QZ.confirm?qzConfirmBox():null;
  return el('div',{class:'qzwrap'},
    el('div',{class:'qzhead'},el('span',{class:'qznum'},`Question ${i+1} sur ${N}`),el('span',{class:'qztag'},qzSubjLabel(q))),
    dots,card,conf,nav,
    review?null:el('p',{class:'qzfoot'},btn('Terminer maintenant',()=>qzFinish(),'quiet'),btn('Quitter (le questionnaire est gardé)',()=>{QZ.view='start';qzRender();},'quiet')));

function makeQzPad(q,resp,onChange){

  const tag=el('div',{class:'edtag',hidden:true}),wrap=el('div',{class:'edwrap'},staff,tag);
  const accBtns=[[1,'♯','Dièse'],[-1,'♭','Bémol'],[0,'♮','Bécarre']].map(([a,g,n])=>el('button',{class:'edbtn edtog edacc',type:'button','data-a':a,title:`${n} pour la prochaine note`,onclick:()=>{acc=acc===a?null:a;paint();}},el('b',{},g),el('small',{},n)));
  const info=el('p',{class:'edinfo'});
  const paint=()=>{accBtns.forEach(b=>b.setAttribute('aria-pressed',String(acc===+b.dataset.a)));
    info.textContent=P.mode==='chord'?`Touche la portée pour ajouter une note (toutes empilées). Touche une note posée pour l'enlever.${notes.length?' Notes : '+notes.slice().sort((a,b)=>dia(a)-dia(b)).map(nn).join(' – '):''}`
      :P.mode==='seq'?`Touche la portée pour ajouter les notes de gauche à droite (${notes.length}/${P.max||8}).`:'Pose le doigt sur la portée et glisse jusqu\'à la bonne note (son nom s\'affiche), puis lève le doigt. ▲ ▼ ajustent ensuite la note. Choisis d\'abord ♯ ou ♭ si elle est altérée.';};

  const touch=matchMedia('(pointer:coarse)').matches;
  let svg=null;const render=()=>{const w=staff.clientWidth||600;draw(staff,P.build(notes).replace('X:1\n','X:1\n%%stretchlast 1\n'),{paddingtop:16,paddingbottom:16,staffwidth:Math.max(120,Math.min(420,w/(touch?(P.mode==='seq'?1.6:2.8):1.5)))});svg=staff.querySelector('svg');};

  function hit(e){

    const k=Math.round((e.clientY-r.top)/step);if(k<-6||k>14)return null;const d=STAFF_TOP[P.clef]-k;return{d,y:r.top+k*step,step};
  }
  /* aperçu : note fantôme + nom de la note, affiché au-dessus du doigt */
  function ghost(e,h){let g=svg&&svg.querySelector('.edghost');
    if(!h){tag.hidden=true;if(g)g.remove();return;}
    const n=fromDia(h.d,acc==null?0:acc),wr=wrap.getBoundingClientRect();tag.hidden=false;tag.textContent=nn(n);
    tag.style.left=(e.clientX-wr.left+(e.pointerType==='touch'?-18:14))+'px';tag.style.top=(h.y-wr.top-(e.pointerType==='touch'?58:12))+'px';
    const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=h.y;const ctm=svg.getScreenCTM();if(!ctm)return;const p=pt.matrixTransform(ctm.inverse()),sc=ctm.a||1;
    if(!g){g=document.createElementNS('http://www.w3.org/2000/svg','ellipse');g.setAttribute('class','edghost');svg.append(g);}

    if(P.mode==='one'){notes.length=0;notes.push(n);}
    else if(P.mode==='chord'){const k=notes.findIndex(x=>dia(x)===h.d);if(k>=0){if(acc==null)notes.splice(k,1);else notes[k]=n;}else if(notes.length<(P.max||4))notes.push(n);else{feedback(`Au plus ${P.max||4} notes.`,'bad');return;}}
    else{if(notes.length>=(P.max||8)){feedback('La portée est pleine : efface une note avant d\'en ajouter.','bad');return;}notes.push(n);}
    feedback('');acc=null;A.init();A.note(noteMidi(n),A.ctx.currentTime+.01,.5,.4,A.out);commit();
  }
  /* au doigt : on pose le doigt, on glisse pour ajuster (le nom de la note s'affiche), on lève pour poser */
  let drag=null;

  const tools=el('div',{class:'toolbar qzpadtools'},btn('▲ Monter',()=>nudge(1)),btn('▼ Descendre',()=>nudge(-1)),btn('Effacer la dernière',()=>{notes.pop();commit();}),btn('Tout effacer',()=>{notes.length=0;commit();}),
    btn('▶ Écouter',()=>{const g=(P.given||[]).map(noteMidi),s=notes.slice().sort((a,b)=>P.mode==='seq'?0:dia(a)-dia(b)).map(noteMidi);if(P.mode==='chord'){A.init();stop();run({items:[...g.map((m,i)=>({u:i,d:1,midi:m})),...(s.length?[{u:g.length,d:2,chord:s}]:[])],us:.7,endU:g.length+2});}else{const all=[...g,...s];if(all.length){A.init();stop();run({items:all.map((m,i)=>({u:i,d:1,midi:m})),us:.55,endU:all.length});}}}));
  const elx=el('div',{class:'qzpadbox'},el('div',{class:'edpal'},el('div',{class:'edgrp'},...accBtns)),wrap,info,tools);
  requestAnimationFrame(()=>{render();paint();});
  return{el:elx};
}

const PDF_W=816,PDF_H=1056,PDF_MX=60,PDF_MT=54,PDF_MB=64,PDF_S=2.4;      /* format lettre, en px CSS (96 ppp) */

async function pdfStaff(abc,width,scale=.82){
  if(!HAS_ABC())return null;
  const box=document.createElement('div');box.style.cssText=`position:fixed;left:-20000px;top:0;width:${width}px;color:#000;background:#fff`;document.body.append(box);
  try{
    ABCJS.renderAbc(box,abc,{add_classes:false,staffwidth:Math.max(60,width/scale-16),scale,paddingleft:2,paddingright:2,paddingtop:4,paddingbottom:2,foregroundColor:'#000'});
    const svg=box.querySelector('svg');if(!svg)return null;
    const bb=svg.getBoundingClientRect();const w=parseFloat(svg.getAttribute('width'))||bb.width,h=parseFloat(svg.getAttribute('height'))||bb.height;
    svg.setAttribute('xmlns','http://www.w3.org/2000/svg');if(!svg.getAttribute('viewBox'))svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
    svg.removeAttribute('style');svg.setAttribute('width',String(w*PDF_S));svg.setAttribute('height',String(h*PDF_S));

/* texte */
const pctx=(()=>{let c=null;return()=>c||(c=document.createElement('canvas').getContext('2d'));})();
function pfont(x,size,w='400',fam=PF){x.font=`${w} ${size}px ${fam}`;}
function pwrap(text,size,maxW,w='400',fam=PF){
  const x=pctx();pfont(x,size,w,fam);const out=[];
  for(const para of String(text).split('\n')){let line='';for(const word of para.split(/\s+/)){const t=line?line+' '+word:word;if(x.measureText(t).width>maxW&&line){out.push(line);line=word;}else line=t;}out.push(line);}
  return out;
}
/* bloc = {h, draw(x,y)} ; mise en page en deux temps (mesure puis dessin) pour numéroter les pages */
function blkText(text,{size=13,w='400',fam=PF,color='#111',indent=0,lh=1.38,gap=0,maxW=PDF_CW-indent}={}){
  const lines=pwrap(T(text),size,maxW,w,fam),L=size*lh;
  return{h:lines.length*L+gap,draw(x,y){pfont(x,size,w,fam);x.fillStyle=color;lines.forEach((s,i)=>x.fillText(s,PDF_MX+indent,y+size+i*L));}};
}
function blkImg(st,{indent=0,maxW=PDF_CW-indent,gap=4}={}){
  if(!st)return{h:0,draw(){}};const sc=Math.min(1,maxW/st.w),w=st.w*sc,h=st.h*sc;
  return{h:h+gap,draw(x,y){x.drawImage(st.img,PDF_MX+indent,y,w,h);}};
}
function blkGroup(parts,gap=0){return{h:parts.reduce((a,p)=>a+p.h,0)+gap,draw(x,y){let yy=y;for(const p of parts){p.draw(x,yy);yy+=p.h;}}};}
function blkRule(gap=10){return{h:gap*2,draw(x,y){x.strokeStyle='#bbb';x.lineWidth=1;x.beginPath();x.moveTo(PDF_MX,y+gap);x.lineTo(PDF_W-PDF_MX,y+gap);x.stroke();}};}
function blkLine(label,{indent=28,len=300,size=12.5}={}){
  return{h:size*2.4,draw(x,y){pfont(x,size);x.fillStyle='#111';const by=y+size*1.6;label=T(label);x.fillText(label,PDF_MX+indent,by);const lw=x.measureText(label).width;
    x.strokeStyle='#555';x.lineWidth=.8;x.beginPath();x.moveTo(PDF_MX+indent+lw+6,by+2);x.lineTo(PDF_MX+indent+lw+6+len,by+2);x.stroke();}};
}
function blkNum(n,mark){ /* numéro (et ✓ / ✗) dessiné dans la marge de la question */
  return{h:0,draw(x,y){pfont(x,13,'700');x.fillStyle='#111';x.fillText(n+'.',PDF_MX,y+13);
    if(mark!=null){pfont(x,16,'700');x.fillStyle=mark?'#1C7F4F':'#C2352E';x.fillText(mark?'✓':'✗',PDF_MX-22,y+14);}}};
}
async function pdfPages(blocks,{footer}){
  /* pagination */
  const pages=[[]];let y=PDF_MT;const maxY=PDF_H-PDF_MB;
  for(const b of blocks){
    if(b.pageBreak){if(pages[pages.length-1].length){pages.push([]);}y=PDF_MT;continue;}
    if(y+b.h>maxY&&pages[pages.length-1].length){pages.push([]);y=PDF_MT;}
    pages[pages.length-1].push([b,y]);y+=b.h;
  }
  const jpgs=[];
  for(let p=0;p<pages.length;p++){
    const c=document.createElement('canvas');c.width=Math.round(PDF_W*PDF_S);c.height=Math.round(PDF_H*PDF_S);
    const x=c.getContext('2d');x.scale(PDF_S,PDF_S);x.fillStyle='#fff';x.fillRect(0,0,PDF_W,PDF_H);x.textBaseline='alphabetic';
    for(const[b,yy]of pages[p])b.draw(x,yy);
    pfont(x,9.5);x.fillStyle='#777';x.fillText(T(footer),PDF_MX,PDF_H-30);const pg=TL(`Page ${p+1} de ${pages.length}`,`Page ${p+1} of ${pages.length}`,`Página ${p+1} de ${pages.length}`);x.fillText(pg,PDF_W-PDF_MX-x.measureText(pg).width,PDF_H-30);
    const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',.9));c.width=c.height=0;
    jpgs.push({bytes:new Uint8Array(await blob.arrayBuffer()),w:Math.round(PDF_W*PDF_S),h:Math.round(PDF_H*PDF_S)});
  }
  return pdfAssemble(jpgs);
}
/* petit écrivain PDF : une image JPEG pleine page par page */
function pdfAssemble(pages,title='MusicDEV'){
  const enc=new TextEncoder(),parts=[],offs=[];let pos=0;
  const put=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);pos+=b.length;};
  const obj=(n,body)=>{offs[n]=pos;put(`${n} 0 obj\n`);body();put('\nendobj\n');};
  put('%PDF-1.4\n');put(new Uint8Array([37,226,227,207,211,10]));
  const n=pages.length,kids=pages.map((_,i)=>`${3+i*3} 0 R`).join(' ');
  obj(1,()=>put('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>put(`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`));
  pages.forEach((pg,i)=>{
    const P=3+i*3,C=P+1,I=P+2,cs=`q 612 0 0 792 0 0 cm /Im0 Do Q`;
    obj(P,()=>put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /XObject << /Im0 ${I} 0 R >> >> /Contents ${C} 0 R >>`));
    obj(C,()=>put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(I,()=>{put(`<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.bytes.length} >>\nstream\n`);put(pg.bytes);put('\nendstream');});
  });
  const info=3+n*3;const esc=s=>s.replace(/[()\\]/g,'\\$&').replace(/[^\x20-\x7e]/g,'');
  obj(info,()=>put(`<< /Title (${esc(title)}) /Producer (MusicDEV) >>`));
  const xref=pos;let x=`xref\n0 ${info+1}\n0000000000 65535 f \n`;for(let k=1;k<=info;k++)x+=String(offs[k]).padStart(10,'0')+' 00000 n \n';
  put(x+`trailer\n<< /Size ${info+1} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}

const QW=PDF_CW-28;   /* largeur utile à droite du numéro */
async function pdfQuestion(q,k,{mode,resp}){
  /* mode : 'blank' (questionnaire vierge) ou 'result' (copie corrigée de l'élève) */
  const parts=[],res=mode==='result',ok=res?q.check(resp):null;
  parts.push(blkNum(k+1,res?ok:null));
  parts.push(blkText(T(q.prompt)+(q.fmt==='listen'?TL(' (question d\'écoute)',' (listening question)',' (pregunta de audición)'):''),{size:13,w:'700',indent:28,maxW:QW,gap:4}));
  if(q.abc&&!q.rhy)parts.push(blkImg(await pdfStaff(q.abc,q.small?220:Math.min(QW,520)),{indent:28}));
  if(!res){
    if(q.opts){
      if(q.opts.some(o=>o.abc)){
        const cols=Math.min(4,q.opts.length),cw=(QW-(cols-1)*12)/cols,imgs=await Promise.all(q.opts.map(o=>pdfStaff(o.abc,o.small?Math.min(cw,150):cw-20,.7)));
        let rowH=0;imgs.forEach(im=>{if(im)rowH=Math.max(rowH,im.h*Math.min(1,(cw-20)/im.w));});
        parts.push({h:rowH+16,draw(x,y){imgs.forEach((im,i)=>{const cx=PDF_MX+28+i*(cw+12);pfont(x,12.5,'700');x.fillStyle='#111';
          x.beginPath();x.arc(cx+6,y+9,5.5,0,Math.PI*2);x.strokeStyle='#333';x.lineWidth=1;x.stroke();x.fillText(QA[i],cx+16,y+13);
          if(im){const s=Math.min(1,(cw-20)/im.w);x.drawImage(im.img,cx+4,y+18,im.w*s,im.h*s);}});}});
      }else q.opts.forEach((o,i)=>{const t=blkText(`${QA[i]})  ${T(o.t)}`,{size:12.5,indent:48,maxW:QW-24,lh:1.35});
        parts.push({h:t.h+3,draw(x,y){x.beginPath();x.arc(PDF_MX+38,y+8.5,5.5,0,Math.PI*2);x.strokeStyle='#333';x.lineWidth=1;x.stroke();t.draw(x,y);}});});
    }else if(q.pad){parts.push(blkImg(await pdfStaff(q.paperAbc,q.pad.mode==='seq'?QW:Math.min(QW,340),.95),{indent:28}));parts.push(blkText('Écris ta réponse sur la portée.',{size:11,color:'#555',indent:28}));}
    else if(q.rhy){parts.push(blkImg(await pdfStaff(q.paperAbc,Math.min(QW,460),.95),{indent:28}));parts.push(blkText('Ajoute tes figures dans l\'espace vide de la mesure.',{size:11,color:'#555',indent:28}));}
    else if(q.fields)parts.push(blkLine(`${TL('Réponse','Answer','Respuesta')} (${q.fields.map(f=>T(f.label).toLowerCase()).join(TL(' et ',' and ',' y '))})${TL(' :',':',':')}`,{len:220}));
    else parts.push(blkLine('Réponse :',{len:260}));
  }else{
    if(q.rhy)parts.push(blkImg(await pdfStaff(q.paperAbc,Math.min(QW,460)),{indent:28}));
    const has=qzAnswered(q,resp);
    if((q.pad||q.rhy)&&has){parts.push(blkText('Ta réponse :',{size:12,indent:28,color:'#333'}));parts.push(blkImg(await pdfStaff(q.respAbc(resp),q.pad&&q.pad.mode==='seq'?QW:Math.min(QW,340)),{indent:28}));}
    else parts.push(blkText(TL('Ta réponse : ','Your answer: ','Tu respuesta: ')+(has?T(q.respText(resp)):TL('(aucune réponse)','(no answer)','(sin respuesta)')),{size:12.5,indent:28,color:'#222',maxW:QW}));
    if(!ok){parts.push(blkText(TL('Bonne réponse : ','Correct answer: ','Respuesta correcta: ')+T(q.answerText),{size:12.5,w:'700',indent:28,color:'#1C7F4F',maxW:QW}));
      if(q.answerAbc&&(q.pad||q.rhy))parts.push(blkImg(await pdfStaff(q.answerAbc,q.pad&&q.pad.mode==='seq'?QW:Math.min(QW,340)),{indent:28}));}
  }
  return blkGroup(parts,18);
}
const pdfSubjHead=id=>blkText(T(QZ_SUBJ.find(s=>s.id===id).t).toUpperCase(),{size:10.5,w:'700',color:'#2F5B53',gap:6});
function pdfHeader(title,lines){
  const parts=[blkText(title,{size:22,w:'700',fam:PFT,gap:6})];
  lines.forEach(l=>parts.push(typeof l==='string'?blkText(l,{size:11.5,color:'#444',gap:2}):l));
  parts.push(blkRule(8));return blkGroup(parts,4);
}
const qzSubjSummary=(cfg,paper)=>QZ_SUBJ.filter(s=>!(paper&&s.listen)).map(s=>{const on=s.subs.filter(([id])=>cfg.topics.includes(id));return !on.length?null:on.length===s.subs.length?T(s.t):`${T(s.t)} (${on.map(x=>T(x[1]).toLowerCase()).join(', ')})`;}).filter(Boolean).join(' · ');
async function qzPdfBlank(qs,cfg){
  await pdfFonts();
  const title=(QZ.title||'').trim()||'Évaluation de théorie musicale',lv=T(QZ_LEVELS[cfg.level-1][1]),NIV=TL('niveau','level','nivel');
  const nameLine={h:30,draw(x,y){pfont(x,12.5);x.fillStyle='#111';const by=y+20;let cx=PDF_MX;
    for(let[lab,len]of[['Nom :',250],['Groupe :',90],['Date :',120]]){lab=T(lab);x.fillText(lab,cx,by);const w=x.measureText(lab).width;x.strokeStyle='#555';x.lineWidth=.8;x.beginPath();x.moveTo(cx+w+6,by+2);x.lineTo(cx+w+6+len,by+2);x.stroke();cx+=w+len+26;}}};
  const blocks=[pdfHeader(title,[nameLine,`${qs.length} ${TL('questions','questions','preguntas')} · ${NIV} ${lv.toLowerCase()} · ${TL('Résultat :','Result:','Resultado:')} ______ / ${qs.length}`,TL('Sujets : ','Topics: ','Temas: ')+qzSubjSummary(cfg,true),TL('Pour les questions à choix, coche la bonne réponse. Pour les questions sur la portée, écris directement sur la portée.','For multiple-choice questions, tick the correct answer. For staff questions, write directly on the staff.','En las preguntas de opción múltiple, marca la respuesta correcta. En las preguntas con pentagrama, escribe directamente en el pentagrama.')])];
  let cur=null;
  for(let k=0;k<qs.length;k++){const q=qs[k],b=await pdfQuestion(q,k,{mode:'blank'});
    if(q.subj!==cur){cur=q.subj;blocks.push(blkGroup([pdfSubjHead(cur),b]));}else blocks.push(b);}
  blocks.push({pageBreak:true});
  blocks.push(pdfHeader(TL('Corrigé','Answer key','Solucionario'),[T(title)+` · ${qs.length} ${TL('questions','questions','preguntas')} · ${NIV} ${lv.toLowerCase()}`]));
  /* corrigé sur deux colonnes ; les réponses avec portée prennent toute la largeur */
  const half=PDF_CW/2-10;let pend=null;
  const flush=()=>{if(pend){blocks.push(pend.blk);pend=null;}};
  for(let k=0;k<qs.length;k++){const q=qs[k],staff=q.answerAbc&&(q.pad||q.rhy);
    if(staff){flush();const parts=[blkNum(k+1,null),blkText(q.answerText,{size:12,indent:28,maxW:QW})];
      parts.push(blkImg(await pdfStaff(q.answerAbc,q.pad&&q.pad.mode==='seq'?Math.min(QW,460):Math.min(QW,260),.75),{indent:28}));blocks.push(blkGroup(parts,8));continue;}
    const t=blkText(q.answerText,{size:12,indent:28,maxW:half-28});const cell={h:t.h,draw(x,y,dx=0){x.save();x.translate(dx,0);blkNum(k+1,null).draw(x,y);t.draw(x,y);x.restore();}};
    if(!pend){pend={a:cell,blk:{h:cell.h+8,draw(x,y){cell.draw(x,y);}}};}
    else{const a=pend.a;blocks.push({h:Math.max(a.h,cell.h)+8,draw(x,y){a.draw(x,y);cell.draw(x,y,PDF_CW/2+10);}});pend=null;}}
  flush();
  return pdfPages(blocks,{footer:`MusicDEV · ${T(title)}`});
}
async function qzPdfResult(t){
  await pdfFonts();
  const N=t.qs.length,sc=qzScore(t),pc=Math.round(100*sc/N),lv=T(QZ_LEVELS[t.cfg.level-1][1]);
  const by=QZ_SUBJ.map(s=>{const qs=t.qs.map((q,i)=>[q,i]).filter(([q])=>q.subj===s.id);if(!qs.length)return null;return `${T(s.t)}${TL(' : ',': ',': ')}${qs.filter(([q,i])=>q.check(t.resp[i])).length}/${qs.length}`;}).filter(Boolean).join(' · ');
  const scoreBox={h:58,draw(x,y){x.fillStyle='#EEF5F2';x.fillRect(PDF_MX,y+4,PDF_CW,48);pfont(x,24,'700',PFT);x.fillStyle='#2F5B53';x.fillText(TL(`Résultat : ${sc} / ${N}`,`Result: ${sc} / ${N}`,`Resultado: ${sc} / ${N}`),PDF_MX+16,y+37);
    pfont(x,18,'700');const s=`${pc} %`;x.fillText(s,PDF_W-PDF_MX-16-x.measureText(s).width,y+36);}};
  const blocks=[pdfHeader(TL('Tester mes connaissances : résultats','Test my knowledge: results','Pon a prueba tus conocimientos: resultados'),[(t.name?`${TL('Nom : ','Name: ','Nombre: ')}${t.name} · `:'')+`${TL('Date : ','Date: ','Fecha: ')}${qzDate(t.date)} · ${TL('niveau','level','nivel')} ${lv.toLowerCase()}`,scoreBox,by])];
  let cur=null;
  for(let k=0;k<N;k++){const q=t.qs[k],b=await pdfQuestion(q,k,{mode:'result',resp:t.resp[k]});
    if(q.subj!==cur){cur=q.subj;blocks.push(blkGroup([pdfSubjHead(cur),b]));}else blocks.push(b);}
  return pdfPages(blocks,{footer:`MusicDEV · ${TL('Tester mes connaissances','Test my knowledge','Pon a prueba tus conocimientos')}${t.name?' · '+t.name:''}`});
}

/* ---------------- MÉTRONOME ---------------- */
const MT_DEF={bpm:96,beats:4,vol:{acc:.9,beat:.7,e8:0,e3:0,e16:0},shuffle:false,sound:'bip',master:.9,
  ramp:{on:false,step:4,every:4,to:140},mute:{on:false,play:2,silent:2}};
const MT=tlLoad('atelier-metro',MT_DEF);MT.vol=Object.assign({},MT_DEF.vol,MT.vol);MT.ramp=Object.assign({},MT_DEF.ramp,MT.ramp);MT.mute=Object.assign({},MT_DEF.mute,MT.mute);
const MS={on:false,timer:0,next:0,beat:0,bar:0,startBpm:0,taps:[],ui:null,master:null,queue:[]};
const mtSave=()=>tlSave('atelier-metro',MT);
const TEMPO_WORDS=[[40,'Grave'],[60,'Largo'],[66,'Larghetto'],[76,'Adagio'],[108,'Andante'],[120,'Moderato'],[156,'Allegro'],[176,'Vivace'],[200,'Presto'],[999,'Prestissimo']];
const tempoWord=b=>TEMPO_WORDS.find(([m])=>b<m)[1];
/* sons du métronome : trois hauteurs (temps fort, temps, subdivisions) */
function mtTick(t,kind,g){
  const c=A.ctx,dest=MS.master;if(g<=0||!dest)return;
  const f={acc:[1760,2093],beat:[1320,1568],sub:[990,1175]}[kind];
  if(MT.sound==='bois'){
    const out=c.createGain();out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(.8*g,t+.002);out.gain.exponentialRampToValueAtTime(.0001,t+.09);out.connect(dest);
    const base={acc:1280,beat:900,sub:640}[kind];
    for(const[m,a]of[[1,1],[2.03,.3]]){const o=c.createOscillator(),og=c.createGain();o.type='sine';o.frequency.setValueAtTime(base*m*1.07,t);o.frequency.exponentialRampToValueAtTime(base*m,t+.015);og.gain.value=a;o.connect(og);og.connect(out);o.start(t);o.stop(t+.1);}
    return;
  }
  if(MT.sound==='clic'){
    const o=c.createOscillator(),hp=c.createBiquadFilter(),out=c.createGain();o.type='square';o.frequency.value=f[0]*.9;hp.type='highpass';hp.frequency.value=700;
    out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(.35*g,t+.001);out.gain.exponentialRampToValueAtTime(.0001,t+.025);o.connect(hp);hp.connect(out);out.connect(dest);o.start(t);o.stop(t+.04);return;
  }
  const o=c.createOscillator(),out=c.createGain();o.type='sine';o.frequency.value=f[0];
  out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(.7*g,t+.001);out.gain.exponentialRampToValueAtTime(.0001,t+(kind==='sub'?.035:.06));
  o.connect(out);out.connect(dest);o.start(t);o.stop(t+.08);
}
/* positions dans un temps (fraction) -> [son, volume] ; on garde le plus fort quand deux couches tombent ensemble */
function mtSlots(first){
  const v=MT.vol,m=new Map();const put=(p,k,g)=>{if(g<=0)return;const o=m.get(p);if(!o||g>o[1])m.set(p,[k,g]);};
  if(first&&MT.beats>1&&v.acc>0)put(0,'acc',v.acc);else put(0,'beat',v.beat);
  put(.5,'sub',v.e8);
  if(MT.shuffle)put(2/3,'sub',v.e3);else{put(1/3,'sub',v.e3);put(2/3,'sub',v.e3);}
  [.25,.5,.75].forEach(p=>put(p,'sub',v.e16));
  return[...m.entries()].sort((a,b)=>a[0]-b[0]);
}
function mtSchedule(){
  const c=A.ctx;
  while(MS.next<c.currentTime+.12){
    const spb=60/MT.bpm,t=MS.next,first=MS.beat===0;
    const silent=MT.mute.on&&(MS.bar%(MT.mute.play+MT.mute.silent))>=MT.mute.play;
    if(!silent)for(const[p,[k,g]]of mtSlots(first))mtTick(t+p*spb,k,g);
    MS.queue.push({t,beat:MS.beat,bar:MS.bar,silent});
    MS.beat++;MS.next+=spb;
    if(MS.beat>=Math.max(1,MT.beats)){MS.beat=0;MS.bar++;
      if(MT.ramp.on&&MS.bar%MT.ramp.every===0){const dir=MT.ramp.to>=MS.startBpm?1:-1;const nb=MT.bpm+dir*MT.ramp.step;MT.bpm=dir>0?Math.min(MT.ramp.to,nb):Math.max(MT.ramp.to,nb);mtShowBpm();}}
  }
}
function mtFrame(){
  if(!MS.on)return;const c=A.ctx;
  while(MS.queue.length&&MS.queue[0].t<=c.currentTime){const q=MS.queue.shift();mtLight(q);}
  requestAnimationFrame(mtFrame);
}
function metroStart(){
  if(MS.on)return;const c=A.init();
  MS.master=c.createGain();MS.master.gain.value=MT.master;MS.master.connect(c.destination);
  MS.on=true;MS.beat=0;MS.bar=0;MS.queue=[];MS.startBpm=MT.bpm;MS.next=c.currentTime+.08;
  mtSchedule();MS.timer=setInterval(mtSchedule,25);requestAnimationFrame(mtFrame);mtUi();
}
function metroStop(){
  if(!MS.on)return;MS.on=false;clearInterval(MS.timer);MS.timer=0;MS.queue=[];
  try{const g=MS.master;g.gain.setTargetAtTime(0,A.ctx.currentTime,.01);setTimeout(()=>g.disconnect(),200);}catch(e){}MS.master=null;
  if(MT.ramp.on&&MS.startBpm)MT.bpm=MS.startBpm;mtShowBpm();mtUi();mtLight(null);
}
const mtToggle=()=>MS.on?metroStop():metroStart();
function mtSetBpm(b){MT.bpm=Math.max(30,Math.min(260,Math.round(b)));if(MS.on)MS.startBpm=MT.bpm;mtShowBpm();mtSave();}
function mtShowBpm(){const u=MS.ui;if(!u)return;u.bpm.textContent=MT.bpm;u.word.textContent=tempoWord(MT.bpm);u.slider.value=MT.bpm;}
function mtUi(){const u=MS.ui;if(!u)return;u.go.textContent=MS.on?'■ Arrêter':'▶ Démarrer';u.go.classList.toggle('on',MS.on);u.panel.classList.toggle('running',MS.on);}
function mtLight(q){const u=MS.ui;if(!u)return;u.leds.querySelectorAll('i').forEach((x,k)=>{x.classList.toggle('on',!!q&&k===q.beat&&!q.silent);x.classList.toggle('mute',!!q&&q.silent);});
  u.barc.textContent=q?`Mesure ${q.bar+1}${q.silent?' · silence':''}`:'';}
function mtTap(){
  const now=performance.now(),T=MS.taps;if(T.length&&now-T[T.length-1]>2000)T.length=0;T.push(now);if(T.length>6)T.shift();
  if(T.length>=2){const d=(T[T.length-1]-T[0])/(T.length-1);mtSetBpm(60000/d);}
}

/* ---------- cordes : manche dessiné ---------- */
const DG_COL={C:'#E2312B',D:'#35A2DB',E:'#2BA35A',F:'#2C3A91',G:'#F0A132',A:'#D72679',B:'#7A3E9B'},DG_LSH='CCDDEFFGGAAB',DG_LFL='CDDEEFGGAABB';
const DG_FING={
  vln:['0','1 bas','1','2 bas','2','3','3 haut','4'],

let DG_UID=0;
/* manche façon tableau de guitare : bois, cordes, frettes régulières, notes en pastilles (naturelles claires, altérées foncées) */
function dgStringsView(I){
  const fret=I.kind==='fret',n=I.strings.length,maxF=fret?DG.frets:12,NS='http://www.w3.org/2000/svg',uid='dg'+(++DG_UID);

  (fret?[[0,'#5a3b26'],[.18,'#7a5236'],[.5,'#8a5f3f'],[.82,'#7a5236'],[1,'#5a3b26']]:[[0,'#141210'],[.2,'#26221e'],[.5,'#2f2a25'],[.8,'#26221e'],[1,'#141210']]).forEach(([o,c])=>mk('stop',{offset:o,'stop-color':c},null,g1));

  mk('rect',{x:4,y:NUT-3,width:NW-8,height:6,class:'dgnut4'});
  if(!fret)for(let f=1;f<=maxF;f++){const fg=DG_FING[I.fing][f];if(!/^\d$/.test(fg||''))continue;const y=bowY(f);
    mk('rect',{x:0,y:y-1.6,width:NW+2,height:3.2,rx:1,class:'dgtape'});mk('text',{x:NW+5,y:y+4,class:'dgtapet'},TL(fg==='1'?'1er':fg+'e',fg==='1'?'1st':fg==='2'?'2nd':fg==='3'?'3rd':fg+'th',fg+'.º'));}
  for(let f=1;f<=maxF&&fret;f++){const y=NUT+ROW*f;mk('line',{x1:6,y1:y,x2:NW-6,y2:y,class:'dgfret4'});
    if(fret)mk('text',{x:NW+12,y:NUT+ROW*(f-0.5)+3,'text-anchor':'middle',class:'dgfnum'},String(f));}
  if(fret){for(const f of[3,5,7,9,15,17,19])if(f<=maxF)mk('circle',{cx:NW/2,cy:NUT+ROW*(f-0.5)+ (f%2?0:0),r:3.4,class:'dginlay4'});
    if(maxF>=12)for(const dx of[-SP,SP])mk('circle',{cx:NW/2+dx,cy:NUT+ROW*11.5,r:3.4,class:'dginlay4'});}
  I.strings.forEach((s,i)=>mk('line',{x1:sx(i),y1:NUT-14,x2:sx(i),y2:VH,class:'dgstr4','stroke-width':Math.max(1,(fret?(I.id==='bass'?3.2:2.2):2)-i*(fret?(I.id==='bass'?0.4:0.25):0.3))}));

    const fg=!fret&&DG_FING[I.fing][f];
    info.replaceChildren(el('div',{class:'dgdtop'},el('div',{class:'dgdname'},dgNameEl(m,'dgnm big'),el('span',{class:'dgsub'},
        `${T('Corde')} ${dgCap(T(dgName(I.strings[si],true)))} · `+(fret?(f===0?T('à vide'):`${T('case')} ${f}`):(f===0?T('à vide'):fg?`${T('doigt')} ${T(fg)}`:T('position plus haute'))))),
        btn('▶ Écouter',()=>dgPlay(m,I.timbre),'')),
      el('div',{class:'dgdmain'},dgStaff(m+I.tr,I.clef)),

      dots.push({g,m});continue;}
    g=mk('g',{class:'dgn4'+(dgBlack(m)?' acc':' nat')+(f===0?' open':'')+(high?' high':''),tabindex:'0',role:'button'});
    if(f===0){mk('rect',{x:x-SP/2+1,y:y-14,width:SP-2,height:26,rx:6,class:'dgn4hit'},null,g);mk('text',{x,y:y+6,'text-anchor':'middle',class:'dgsname'},dgCap(T(dgName(m,DG.flats))),g);}
    else{mk('circle',{cx:x,cy:y,r:R},null,g);
    mk('text',{x,y:y+4,'text-anchor':'middle',class:'dgn4t'},dgCap(T(dgName(m,DG.flats))),g);}
    if(first){const lab=fg.replace(' bas','↓').replace(' haut','↑').replace(' ext.','x').replace(' (½ pos.)','½');const w=lab.length>1?15:12.4;
      mk('rect',{x:x+R-3-w/2,y:y+R-10.2,width:w,height:12.4,rx:6.2,class:'dgn4b'},null,g);mk('text',{x:x+R-3,y:y+R-1.6,'text-anchor':'middle',class:'dgn4bt'},lab,g);}

    fret?el('div',{class:'seg'},...[[12,'Cases 0–12'],[19,'Cases 0–19']].map(([v,l])=>el('button',{type:'button','aria-pressed':String(DG.frets===v),onclick:()=>{DG.frets=v;dgSave();dgRender();}},l))):null);
  info.replaceChildren(el('p',{class:'hint'},fret?'Touche une note sur le manche pour l\'entendre et voir toutes les places qui la donnent.':'Touche une note pour l\'entendre. Les rubans blancs marquent la place des doigts en 1re position, comme sur les touches d\'élèves.'));
  S.keyHandler=null;

}

    let key=Object.keys(IC).find(k=>lab.startsWith(k));const w=document.createElement('div');w.className='mi';
    const ic=document.createElement('i');ic.className='ico';ic.setAttribute('aria-hidden','true');ic.innerHTML=key?IC[key]:IC['Tonalité'];
    const t=document.createElement('span');t.append(lab.replace(/\s*♩\s*$/,'')||'');if(b){const mm=b.textContent.trim().match(/^(♩\.?)\s*=\s*(.*)$/);if(mm){b.textContent='';const q=document.createElement('span');q.className='q';q.textContent=mm[1];b.append(q,' = '+mm[2]);}t.append(b);}
    w.append(t);return w;}));};
new MutationObserver(deco).observe(m,{childList:true});deco();})();
/* partition : centre les lignes de la portée (pas la clé ni les notes) dans l'espace blanc */
(()=>{const sc=document.getElementById('score'),TOP=26,BOT=50; /* un peu plus d'air en bas pour la pastille Réussites */
const fit=()=>{const svg=sc.querySelector('svg');sc.style.marginTop='';sc.style.marginBottom='';if(!svg||sc.classList.contains('single'))return;
  const st=[...svg.querySelectorAll('.abcjs-staff')];if(!st.length)return;
  const R=svg.getBoundingClientRect();if(!R.height)return;
  let top=1e9,bot=-1e9;for(const e of st){const r=e.getBoundingClientRect();top=Math.min(top,r.top);bot=Math.max(bot,r.bottom);}
  const c=(top+bot)/2-R.top,d=R.height-2*c;
  sc.style.marginTop=(TOP+Math.max(0,d))+'px';sc.style.marginBottom=(BOT+Math.max(0,-d))+'px';};
let raf=0;const later=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(fit);};
new MutationObserver(later).observe(sc,{childList:true});addEventListener('resize',later);later();})();
/* barre de boutons : range chaque bouton dans son groupe (action, écoute, outils) */
(()=>{const tb=document.getElementById('toolbar');
const group=()=>{const kids=[...tb.children];if(!kids.length||tb.querySelector(':scope > .tgrow'))return;
  const A=[],B=[],C=[];let stop=null;
  for(const k of kids){if(k.classList.contains('sep'))continue;const t=(k.textContent||'').trim();
    if(k.classList.contains('primary'))A.push(k);
    else if(/^■\s*Arrêter$/.test(t))stop=k;
    else if(k.classList.contains('mnav')||/^[▶●]/.test(t))B.push(k);
    else C.push(k);}
  if(stop){stop.setAttribute('aria-label','Arrêter');stop.title='Arrêter';B.push(stop);}
  const mk=(cls,arr)=>{const d=document.createElement('div');d.className=cls;d.append(...arr);return d;};
  const rows=[mk('tgrow',[A.length&&mk('tg main',A),B.length&&mk('tg listen',B),C.length&&mk('tg tools',C)].filter(Boolean))];
  tb.replaceChildren(...rows);};
new MutationObserver(group).observe(tb,{childList:true});group();})();
</script>

<script>
/* mobile : garder l'onglet et la notion choisis visibles dans les rangées défilantes */
(()=>{const mq=matchMedia('(max-width:600px)');
const center=(row,sel)=>{const a=row&&row.querySelector(sel);if(!a||row.scrollWidth<=row.clientWidth)return;
  const r=row.getBoundingClientRect(),b=a.getBoundingClientRect();row.scrollLeft+=(b.left+b.width/2)-(r.left+r.width/2);};
const fix=()=>{if(!mq.matches)return;
  center(document.querySelector('.libcats'),'[aria-selected="true"]');center(document.querySelector('.libsubs'),'[aria-current="true"]');
  const q=document.querySelector('.libsearch');if(q&&!q.dataset.short){q.dataset.short=1;q.placeholder='Chercher : armure, triolet, cadence…';}};
new MutationObserver(()=>requestAnimationFrame(fix)).observe(document.getElementById('library'),{childList:true,subtree:true,attributes:true,attributeFilter:['aria-selected','aria-current']});
mq.addEventListener?.('change',fix);fix();})();
</script>

<script>
/* mobile : menu déroulant des modules (même navigation que la barre des modules) */
(()=>{const mods=document.getElementById('mods');if(!mods||typeof MODS==='undefined')return;
const box=document.createElement('label');box.className='modpick';
box.innerHTML='<span class="mp-txt"><span class="mp-g"></span><span class="mp-t"></span><span class="mp-s"></span></span><span class="mp-ic" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h13"/></svg></span>';
const sel=document.createElement('select');sel.setAttribute('aria-label','Choisir un module');box.append(sel);
let grp=null;const gOf={};let cur='';
for(const m of MODS){if(m.g){cur=m.g;grp=document.createElement('optgroup');grp.label=m.g;sel.append(grp);}
  gOf[m.id]=cur;const o=new Option(m.t,m.id);(grp||sel).append(o);}
mods.after(box);
const sync=()=>{const m=MODS.find(x=>x.id===S.mod)||MODS[0];sel.value=m.id;
  box.querySelector('.mp-g').textContent='Module'+(gOf[m.id]?' · '+gOf[m.id]:'');box.querySelector('.mp-t').textContent=m.t;box.querySelector('.mp-s').textContent=m.s||'';};
sel.addEventListener('change',()=>{openModule(sel.value);sync();scrollTo({top:0,behavior:'smooth'});});
new MutationObserver(sync).observe(mods,{childList:true,subtree:true,attributes:true,attributeFilter:['aria-current']});sync();})();
</script>

<script>
/* mobile : bouton Réglages (icône) placé dans la grille d'infos */
(()=>{const meta=document.getElementById('meta'),sb=document.getElementById('setbtn');if(!meta||!sb)return;

b.addEventListener('click',()=>sb.click());cell.append(b);

const place=()=>{if(meta.lastElementChild!==cell&&meta.querySelector('.mi'))meta.append(cell);};
new MutationObserver(place).observe(meta,{childList:true});
new MutationObserver(sync).observe(sb,{attributes:true,attributeFilter:['aria-expanded']});place();sync();})();
