llo<\/b> (6)…: 5 o 6 notas en el tiempo de 4.<\/li><\/ul>\n<p>Para tocar bien un tresillo, piensa en la palabra «tre-si-llo» repartida por igual en el tiempo.<\/p>","ex":[{"abc":"X:1\nM:4/4\nL:1/8\nK:C\nc c (3ccc c2 c2 | c2 c2 (3c2c2c2 |]","cap":"Tresillo de corcheas (un tiempo) y luego tresillo de negras (dos tiempos)."},{"abc":"X:1\nM:6/8\nL:1/8\nK:C\nccc (2cc | c3 c3 |]","cap":"Dosillo en 6/8: dos corcheas en el tiempo de tres."}]},{"id":"syncope","t":"Síncopa y contratiempo","title":null,"k":"sincopa contratiempo desplazamiento acento","html":"<p>Una <b>síncopa<\/b> es una nota que empieza en una parte <b>débil<\/b> del tiempo (o en un tiempo débil) y se prolonga sobre la parte <b>fuerte<\/b> siguiente. El acento se desplaza: se siente un desfase. Ejemplo clásico: corchea – negra – corchea.<\/p>\n<p>Un <b>contratiempo<\/b> es una nota tocada en la parte débil, precedida de un silencio en la parte fuerte (silencio de corchea – corchea). La nota no se prolonga.<\/p>\n<p>Truco: cuenta las «y» en voz alta («1 y 2 y») y coloca la nota en la «y» sin cortarla demasiado pronto.<\/p>","ex":[{"abc":"X:1\nM:2/4\nL:1/8\nK:C\nc c2 c | c c2 c | z c z c | z c z c |]","cap":"Dos síncopas (corchea – negra – corchea) y luego contratiempos."}]},{"id":"barres","t":"Barras de compás","title":null,"k":"barra doble barra final compas","html":"<p>La <b>barra de compás<\/b> es una raya vertical que separa los compases. Cada compás contiene exactamente el número de tiempos indicado por la <a href=\"#\" data-go=\"mesures-simples\">indicación de compás<\/a>.<\/p>\n<ul><li><b>Doble barra<\/b> (dos rayas finas): final de una sección, cambio de armadura o de compás.<\/li>\n<li><b>Barra final<\/b> (raya fina + raya gruesa): final de la pieza.<\/li>\n<li><b>Barras de repetición<\/b> (con dos puntos): pasaje que se toca dos veces (<a href=\"#\" data-go=\"reprises\">Signos de repetición<\/a>).<\/li><\/ul>\n<p>Una <b>anacrusa<\/b> es un compás incompleto al principio de la pieza (una o varias notas antes del primer tiempo fuerte). En ese caso, el último compás suele acortarse en la misma medida.<\/p>","ex":[{"abc":"X:1\nM:2/4\nL:1/4\nK:C\nc c | d d || e e |: f f :| g2 |]","cap":"Barra simple, doble barra, barras de repetición, barra final."}]},{"id":"tempo","t":"El tempo","title":null,"k":"tempo bpm metronomo allegro andante adagio largo presto moderato ritardando accelerando","html":"<p>El <b>tempo<\/b> es la velocidad del pulso. Se indica de dos maneras:<\/p>\n<ul><li>con un <b>número de pulsos por minuto<\/b> (♩ = 60: una negra por segundo), que se ajusta en un metrónomo;<\/li>\n<li>con un <b>término italiano<\/b> (valores aproximados):<\/li><\/ul>\n<table class=\"lt\"><tr><th>Término<\/th><th>Significado<\/th><th>Aprox.<\/th><\/tr>\n<tr><td>Largo, Lento<\/td><td>muy lento<\/td><td>40–60<\/td><\/tr>\n<tr><td>Adagio<\/td><td>lento<\/td><td>60–76<\/td><\/tr>\n<tr><td>Andante<\/td><td>andando, al paso<\/td><td>76–108<\/td><\/tr>\n<tr><td>Moderato<\/td><td>moderado<\/td><td>108–120<\/td><\/tr>\n<tr><td>Allegro<\/td><td>rápido, alegre<\/td><td>120–168<\/td><\/tr>\n<tr><td>Presto<\/td><td>muy rápido<\/td><td>168–200<\/td><\/tr><\/table>\n<p><b>Cambios de tempo<\/b>: <i>accelerando<\/i> (accel., acelerando), <i>ritardando<\/i> o <i>rallentando<\/i> (rit., rall., ralentizando), <i>a tempo<\/i> (volver al tempo), <i>rubato<\/i> (tempo flexible). El <b>calderón<\/b> (𝄐) prolonga una nota o un silencio a criterio del intérprete.<\/p>","ex":[{"abc":"X:1\nM:4/4\nL:1/4\nQ:\"Adagio\" 1/4=66\nK:C\nc d e f | g2 !fermata!g2 |]","cap":"Indicación de tempo y calderón."}]}]},{"id":"gammes","t":"Escalas y tonalidades","topics":[{"id":"tons-demitons","t":"Tonos y semitonos","title":null,"k":"tono semitono cromatico diatonico","html":"<p>El <b>semitono<\/b> es la distancia más pequeña entre dos notas en nuestra música: dos teclas vecinas del piano. El <b>tono<\/b> vale dos semitonos.<\/p>\n<p>Entre las notas naturales hay un tono en todas partes, <b>salvo entre mi–fa y si–do<\/b>, donde solo hay un semitono.<\/p>\n<ul><li><b>Semitono diatónico<\/b>: dos nombres diferentes (mi–fa, do–re♭).<\/li>\n<li><b>Semitono cromático<\/b>: mismo nombre, alterado (do–do♯).<\/li><\/ul>","ex":[{"abc":"X:1\nL:1/4\nK:C\nC D E F G A B c |]\nw: do re mi fa sol la si do","cap":"Do re (tono), re mi (tono), mi fa (semitono), fa sol, sol la, la si (tonos), si do (semitono)."}]},{"id":"gamme-majeure","t":"La escala mayor","title":null,"k":"escala mayor tono tono semitono estructura","html":"<p>Una <b>escala<\/b> es una sucesión de notas por grados conjuntos que parte de una nota (la <b>tónica<\/b>) y sube hasta la misma nota una octava más arriba.<\/p>\n<p>La <b>escala mayor<\/b> sigue siempre el mismo modelo:<\/p>\n<p class=\"formula\">T – T – ½ – T – T – T – ½<\/p>\n<p>(T = tono, ½ = semitono). Los semitonos están entre los grados 3–4 y 7–8. La escala de do mayor solo usa notas naturales; para las demás, se añaden sostenidos o bemoles para respetar el modelo. Esas alteraciones forman la <a href=\"#\" data-go=\"armures\">armadura<\/a>.<\/p>\n<p>Una escala mayor está formada por dos <b>tetracordos<\/b> idénticos (T–T–½) separados por un tono: do-re-mi-fa / sol-la-si-do.<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:C\nC D E F G A B c | c B A G F E D C |]","cap":"Do mayor, ascendente y descendente."},{"abc":"X:1\nL:1/4\nK:G\nG A B c d e f g |]\nw: sol la si do re mi fa♯ sol","cap":"Sol mayor: hace falta un fa♯ para mantener el semitono entre los grados 7 y 8."}]},{"id":"gammes-mineures","t":"Las escalas menores","title":null,"k":"menor natural armonica melodica sensible","html":"<p class=\"lxtip\">¿Eres nuevo? Empieza por el método paso a paso: <a href=\"#\" data-go=\"relatives\">de la escala mayor a sus tres escalas menores<\/a>.<\/p>\n<p>Hay tres formas de escala menor. Todas comparten el principio: <b>T – ½ – T – T<\/b> (la tercera es menor).<\/p>\n<ul><li><b>Menor natural<\/b>: T – ½ – T – T – ½ – T – T. Mismas notas que su <a href=\"#\" data-go=\"relatives\">relativa mayor<\/a> (la menor = notas de do mayor).<\/li>\n<li><b>Menor armónica<\/b>: se <b>sube el 7.<sup>o<\/sup> grado<\/b> un semitono. Se convierte en <b>sensible<\/b>, a un semitono de la tónica. Entre los grados 6 y 7 aparece una <b>segunda aumentada<\/b> (1 tono y ½), muy característica.<\/li>\n<li><b>Menor melódica<\/b>: al subir, se <b>suben el 6.<sup>o<\/sup> y el 7.<sup>o<\/sup> grado<\/b>; al bajar, se vuelve a la forma natural.<\/li><\/ul>\n<p>La forma armónica sirve sobre todo para construir los acordes (V y vii°); la forma melódica, para escribir melodías fluidas.<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:Am\nA, B, C D E F G A |]\nw: la si do re mi fa sol la","cap":"La menor natural."},{"abc":"X:1\nL:1/4\nK:Am\nA, B, C D E F ^G A |]\nw: la si do re mi fa sol♯ la","cap":"La menor armónica: sol♯ (sensible)."},{"abc":"X:1\nL:1/4\nK:Am\nA, B, C D E ^F ^G A | A =G =F E D C B, A, |]","cap":"La menor melódica: fa♯ y sol♯ al subir, naturales al bajar."}]},{"id":"degres","t":"Los grados de la escala","title":null,"k":"tonica supertonica mediante subdominante dominante superdominante sensible subtonica numeros romanos","html":"<p>Cada nota de la escala es un <b>grado<\/b>, numerado con números romanos y con un nombre que describe su función:<\/p>\n<table class=\"lt\"><tr><th>Grado<\/th><th>Nombre<\/th><th>En do mayor<\/th><\/tr>\n<tr><td>I<\/td><td><b>Tónica<\/b>: la nota de reposo, la que da nombre a la tonalidad<\/td><td>do<\/td><\/tr>\n<tr><td>II<\/td><td>Supertónica<\/td><td>re<\/td><\/tr>\n<tr><td>III<\/td><td>Mediante (determina si es mayor o menor)<\/td><td>mi<\/td><\/tr>\n<tr><td>IV<\/td><td>Subdominante<\/td><td>fa<\/td><\/tr>\n<tr><td>V<\/td><td><b>Dominante<\/b>: el grado más importante después de la tónica<\/td><td>sol<\/td><\/tr>\n<tr><td>VI<\/td><td>Superdominante<\/td><td>la<\/td><\/tr>\n<tr><td>VII<\/td><td><b>Sensible<\/b> (a un semitono de la tónica); <b>subtónica<\/b> si está a un tono (menor natural)<\/td><td>si<\/td><\/tr><\/table>\n<p>La sensible «atrae» al oído hacia la tónica: es lo que da la sensación de conclusión.<\/p>","ex":[{"abc":"X:1\nL:1/2\nK:C\nC D E F G A B c |]\nw: I II III IV V VI VII I","cap":"Los grados en do mayor."}]},{"id":"armures","t":"Las armaduras","title":null,"k":"armadura sostenidos bemoles orden encontrar tonalidad","html":"<p>La <b>armadura<\/b> reúne, al principio de cada pentagrama, los sostenidos o los bemoles de la tonalidad. Siempre se escriben <b>en el mismo orden<\/b>:<\/p>\n<p class=\"formula\">Sostenidos: fa – do – sol – re – la – mi – si<br>Bemoles: si – mi – la – re – sol – do – fa<\/p>\n<p>(El orden de los bemoles es el de los sostenidos al revés.) Para recordarlo todo de golpe, mira <a href=\"#\" data-go=\"truc-armures\">el truco del Boss<\/a>.<\/p>\n<p><b>Encontrar la tonalidad mayor<\/b>:<\/p>\n<ul><li>con sostenidos: la tónica está <b>un semitono por encima del último sostenido<\/b> (último sostenido do♯ → re mayor);<\/li>\n<li>con bemoles: la tónica es <b>el penúltimo bemol<\/b> (si♭, mi♭ → mi♭ mayor). Excepción que hay que recordar: un solo bemol = fa mayor;<\/li>\n<li>ninguna alteración: do mayor.<\/li><\/ul>\n<p>Cada armadura corresponde también a una tonalidad menor, la <a href=\"#\" data-go=\"relatives\">relativa<\/a>, situada una tercera menor más abajo. Para saber cuál es, mira la melodía: la última nota, el bajo final y la presencia de la sensible (una alteración accidental) delatan el modo menor.<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:G\nG4 | [K:D] D4 | [K:A] A4 | [K:E] E4 | [K:B] B4 |]\nw: Sol Re La Mi Si","cap":"Armaduras con sostenidos: sol, re, la, mi, si mayor (de 1 a 5 sostenidos)."},{"abc":"X:1\nL:1/4\nK:F\nF4 | [K:Bb] B4 | [K:Eb] E4 | [K:Ab] A4 | [K:Db] D4 |]\nw: Fa Si♭ Mi♭ La♭ Re♭","cap":"Armaduras con bemoles: fa, si♭, mi♭, la♭, re♭ mayor (de 1 a 5 bemoles)."}]},{"id":"truc-armures","t":"El truco del Boss","title":"El truco del Boss: encontrar una armadura de un vistazo","k":"boss truco armadura sostenidos bemoles orden fila tonalidad numero alteraciones encontrar relativa","html":"<p>El truco del Boss: basta con recordar <b>dos filas de nombres<\/b>. Cada fila da a la vez <b>el orden de las alteraciones<\/b> y <b>el nombre de las tonalidades<\/b>, y el número bajo cada nombre indica <b>cuántas alteraciones<\/b> tiene esa tonalidad mayor.<\/p>\n<div class=\"trick-static\">\n<div class=\"tsrow\"><span class=\"tslab\">Sostenidos ♯<\/span><span>Fa♯<i>6<\/i><\/span><span>Do♯<i>7<\/i><\/span><span>Sol<i>1<\/i><\/span><span>Re<i>2<\/i><\/span><span>La<i>3<\/i><\/span><span>Mi<i>4<\/i><\/span><span>Si<i>5<\/i><\/span><\/div>\n<div class=\"tsrow\"><span class=\"tslab\">Bemoles ♭<\/span><span>Si♭<i>2<\/i><\/span><span>Mi♭<i>3<\/i><\/span><span>La♭<i>4<\/i><\/span><span>Re♭<i>5<\/i><\/span><span>Sol♭<i>6<\/i><\/span><span>Do♭<i>7<\/i><\/span><span>Fa<i>1<\/i><\/span><\/div>\n<\/div>\n<p><b>Leer la fila de izquierda a derecha<\/b> da el orden de las alteraciones: <b>fa, do, sol, re, la, mi, si<\/b> para los sostenidos y <b>si, mi, la, re, sol, do, fa<\/b> para los bemoles.<\/p>\n<p><b>De la tonalidad a la armadura<\/b>: busca la tonalidad en su fila; el número de debajo dice cuántas alteraciones hay. Luego se toman <b>desde el principio de la fila<\/b>.<br>\n<i>Ejemplo<\/i>: re mayor → número <b>2<\/b> → los 2 primeros de la fila de los sostenidos: <b>fa♯ y do♯<\/b>.<\/p>\n<p><b>De la armadura a la tonalidad<\/b>: cuenta las alteraciones en la partitura y busca ese número en la fila correcta.<br>\n<i>Ejemplo<\/i>: 4 bemoles → el <b>4<\/b> está bajo <b>la♭<\/b>: estamos en <b>la♭ mayor<\/b>… o en su <a href=\"#\" data-go=\"relatives\">relativa<\/a>, <b>fa menor<\/b> (una tercera menor más abajo).<\/p>\n<p>Ninguna alteración: do mayor (o la menor). Pruébalo: haz clic en una tonalidad aquí abajo.<\/p>\n<div data-widget=\"armtrick\"><\/div>","ex":[]},{"id":"quintes","t":"El círculo de quintas","title":null,"k":"ciclo circulo quintas tonalidades vecinas","html":"<p>Subiendo <b>de quinta en quinta<\/b> a partir de do, se añade un sostenido en cada tonalidad; bajando de quinta en quinta (o subiendo de cuarta en cuarta), se añade un bemol.<\/p>\n<table class=\"lt\"><tr><th>Alteraciones<\/th><th>Mayor<\/th><th>Menor relativa<\/th><\/tr>\n<tr><td>ninguna<\/td><td>do<\/td><td>la<\/td><\/tr>\n<tr><td>1♯ (fa)<\/td><td>sol<\/td><td>mi<\/td><\/tr><tr><td>2♯<\/td><td>re<\/td><td>si<\/td><\/tr><tr><td>3♯<\/td><td>la<\/td><td>fa♯<\/td><\/tr>\n<tr><td>4♯<\/td><td>mi<\/td><td>do♯<\/td><\/tr><tr><td>5♯<\/td><td>si<\/td><td>sol♯<\/td><\/tr><tr><td>6♯<\/td><td>fa♯<\/td><td>re♯<\/td><\/tr><tr><td>7♯<\/td><td>do♯<\/td><td>la♯<\/td><\/tr>\n<tr><td>1♭ (si)<\/td><td>fa<\/td><td>re<\/td><\/tr><tr><td>2♭<\/td><td>si♭<\/td><td>sol<\/td><\/tr><tr><td>3♭<\/td><td>mi♭<\/td><td>do<\/td><\/tr>\n<tr><td>4♭<\/td><td>la♭<\/td><td>fa<\/td><\/tr><tr><td>5♭<\/td><td>re♭<\/td><td>si♭<\/td><\/tr><tr><td>6♭<\/td><td>sol♭<\/td><td>mi♭<\/td><\/tr><tr><td>7♭<\/td><td>do♭<\/td><td>la♭<\/td><\/tr><\/table>\n<p>Las tonalidades <b>vecinas<\/b> (con una alteración de diferencia) comparten muchas notas: la música modula fácilmente entre ellas. Fa♯ mayor y sol♭ mayor son enarmónicas, igual que do♯/re♭ y si/do♭.<\/p>","ex":[]},{"id":"relatives","t":"Tonalidades relativas y escalas menores","title":"Tonalidades relativas: de mayor a menor","k":"relativa menor natural antigua armonica melodica sexto grado sensible armadura","html":"<p>Cada escala mayor tiene una «hermana» menor que usa <b>exactamente las mismas notas<\/b> y, por tanto, la <b>misma armadura<\/b>: es su <b>relativa menor<\/b>. Para encontrarla, basta con partir del <b>6.<sup>o<\/sup> grado<\/b> de la escala mayor.<\/p>\n<p>Sigamos el método con do mayor, paso a paso.<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:C\nC D E F G A B c |]\nw: 1 2 3 4 5 6 7 8","cap":"Do mayor: ninguna alteración. El 6.<sup>o<\/sup> grado está rodeado con un círculo."},{"abc":"X:1\nL:1/4\nK:Am\nA, B, C D E F G A |]\nw: la si do re mi fa sol la","cap":"La menor natural: mismas notas que do mayor, misma armadura (ninguna alteración). Do mayor y la menor son <b>tonalidades relativas<\/b>. Escucha: el color es más oscuro, pero al final le falta impulso, porque el sol está a un tono entero del la."},{"abc":"X:1\nL:1/4\nK:Am\nA, B, C D E F ^G A |]\nw: la si do re mi fa sol♯ la","cap":"El sol♯ está ahora a un semitono del la: es la <b>sensible<\/b>, que «atrae» hacia la tónica. Esta forma sirve para construir los acordes (el V se vuelve mayor: mi–sol♯–si). Pero entre fa y sol♯ hay un gran salto de <b>un tono y medio<\/b> (segunda aumentada), con un color algo oriental."},{"abc":"X:1\nL:1/4\n%%stretchlast 1\nK:Am\nA, B, C D E ^F ^G A |\nw: la si do re mi fa♯ sol♯ la\nA =G =F E D C B, A, |]\nw: la sol fa mi re do si la","cap":"Al <b>subir<\/b>, fa♯ y sol♯ hacen que la melodía fluya hacia la tónica. Al <b>bajar<\/b>, ya no hace falta la sensible: se vuelve a la forma natural (sol y fa rodeados con un círculo)."}]},{"id":"modes","t":"Los modos","title":null,"k":"modos jonico dorico frigio lidio mixolidio eolico locrio","html":"<p>Un <b>modo<\/b> es una escala de 7 notas definida por la posición de sus semitonos. Tocando las teclas blancas del piano a partir de cada nota, se obtienen los 7 modos:<\/p>\n<table class=\"lt\"><tr><th>Modo<\/th><th>En las teclas blancas<\/th><th>Color<\/th><\/tr>\n<tr><td>Jónico<\/td><td>de do a do<\/td><td>= mayor<\/td><\/tr>\n<tr><td>Dórico<\/td><td>de re a re<\/td><td>menor con 6.<sup>a<\/sup> mayor<\/td><\/tr>\n<tr><td>Frigio<\/td><td>de mi a mi<\/td><td>menor con 2.<sup>a<\/sup> menor<\/td><\/tr>\n<tr><td>Lidio<\/td><td>de fa a fa<\/td><td>mayor con 4.<sup>a<\/sup> aumentada<\/td><\/tr>\n<tr><td>Mixolidio<\/td><td>de sol a sol<\/td><td>mayor con 7.<sup>a<\/sup> menor<\/td><\/tr>\n<tr><td>Eólico<\/td><td>de la a la<\/td><td>= menor natural<\/td><\/tr>\n<tr><td>Locrio<\/td><td>de si a si<\/td><td>2.<sup>a<\/sup> menor y 5.<sup>a<\/sup> disminuida<\/td><\/tr><\/table>\n<p>Se oyen en el canto gregoriano, la música tradicional, el jazz, el rock y las bandas sonoras.<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:C\nD E F G A B c d |]\nw: re mi fa sol la si do re","cap":"Modo de re (dórico)."},{"abc":"X:1\nL:1/4\nK:C\nG A B c d e f g |]\nw: sol la si do re mi fa sol","cap":"Modo de sol (mixolidio): la 7.ª es un fa natural."}]},{"id":"autres-gammes","t":"Otras escalas","title":null,"k":"pentatonica cromatica blues tonos enteros hexatonal","html":"<ul><li><b>Pentatónica mayor<\/b> (5 notas, sin semitonos): grados 1, 2, 3, 5, 6 (do re mi sol la). Muy presente en las músicas tradicionales y populares.<\/li>\n<li><b>Pentatónica menor<\/b>: la do re mi sol (grados 1, ♭3, 4, 5, ♭7).<\/li>\n<li><b>Escala de blues<\/b>: la pentatónica menor + la «blue note» (quinta disminuida, ♭5): la do re mi♭ mi sol.<\/li>\n<li><b>Escala cromática<\/b>: los 12 semitonos. Normalmente se escribe con sostenidos al subir y con bemoles al bajar.<\/li>\n<li><b>Escala de tonos enteros<\/b>: 6 notas separadas por tonos enteros (do re mi fa♯ sol♯ la♯). Color flotante, muy apreciado por Debussy.<\/li><\/ul>","ex":[{"abc":"X:1\nL:1/4\nK:C\nC D E G A c |]\nw: do re mi sol la do","cap":"Pentatónica mayor de do."},{"abc":"X:1\nL:1/4\nK:C\nA, C D _E =E G A |]\nw: la do re mi♭ mi sol la","cap":"Escala de blues de la."},{"abc":"X:1\nL:1/8\nK:C\nC ^C D ^D E F ^F G ^G A ^A B c |]","cap":"Escala cromática ascendente."}]}]},{"id":"intervalles","t":"Intervalos","topics":[{"id":"intervalles-def","t":"¿Qué es un intervalo?","title":null,"k":"intervalo melodico armonico contar segunda tercera cuarta quinta sexta septima octava","html":"<p>Un <b>intervalo<\/b> es la distancia entre dos notas.<\/p>\n<ul><li><b>Melódico<\/b>: las notas se tocan una después de la otra (subiendo o bajando).<\/li>\n<li><b>Armónico<\/b>: las notas se tocan al mismo tiempo.<\/li><\/ul>\n<p><b>El nombre (el número)<\/b> se obtiene contando los nombres de las notas, <b>incluyendo la primera y la última<\/b>: do → mi = do, re, mi = 3 notas = una <b>tercera<\/b>. Do → sol = una <b>quinta<\/b>. Do → do = una <b>octava<\/b> (8).<\/p>\n<p>El número no basta: do–mi y do–mi♭ son dos terceras, pero no suenan igual. También hace falta la <a href=\"#\" data-go=\"intervalles-qualites\">calidad<\/a>, que se obtiene contando los semitonos.<\/p>\n<p>En el pentagrama: de una línea a la línea vecina = tercera; de una línea al espacio vecino = segunda; para una octava, se pasa de una línea a un espacio (o al revés).<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:C\nC2 D2 | C2 E2 | C2 F2 | C2 G2 | C2 A2 | C2 B2 | C2 c2 |]\nw: 2.ª * 3.ª * 4.ª * 5.ª * 6.ª * 7.ª * 8.ª *","cap":"Intervalos melódicos a partir de do."}]},{"id":"intervalles-qualites","t":"Calidades y tabla de intervalos","title":null,"k":"justa mayor menor aumentada disminuida tritono semitonos tabla calidad","html":"<p>La <b>calidad<\/b> precisa un intervalo: <b>justo<\/b> (J), <b>mayor<\/b> (M), <b>menor<\/b> (m), <b>aumentado<\/b> (aum.) o <b>disminuido<\/b> (dism.).<\/p>\n<ul><li>Los unísonos, cuartas, quintas y octavas son <b>justos<\/b> (o aumentados/disminuidos).<\/li>\n<li>Las segundas, terceras, sextas y séptimas son <b>mayores o menores<\/b> (o aumentadas/disminuidas).<\/li><\/ul>\n<table class=\"lt\"><tr><th>Intervalo<\/th><th>Abrev.<\/th><th>Semitonos<\/th><th>A partir de do<\/th><\/tr>\n<tr><td>Unísono<\/td><td>Unísono<\/td><td>0<\/td><td>do<\/td><\/tr>\n<tr><td>Segunda menor<\/td><td>2.ª m<\/td><td>1<\/td><td>re♭<\/td><\/tr>\n<tr><td>Segunda mayor<\/td><td>2.ª M<\/td><td>2<\/td><td>re<\/td><\/tr>\n<tr><td>Tercera menor<\/td><td>3.ª m<\/td><td>3<\/td><td>mi♭<\/td><\/tr>\n<tr><td>Tercera mayor<\/td><td>3.ª M<\/td><td>4<\/td><td>mi<\/td><\/tr>\n<tr><td>Cuarta justa<\/td><td>4.ª J<\/td><td>5<\/td><td>fa<\/td><\/tr>\n<tr><td>Cuarta aumentada / quinta disminuida (tritono)<\/td><td>4.ª aum / 5.ª dism<\/td><td>6<\/td><td>fa♯ / sol♭<\/td><\/tr>\n<tr><td>Quinta justa<\/td><td>5.ª J<\/td><td>7<\/td><td>sol<\/td><\/tr>\n<tr><td>Sexta menor<\/td><td>6.ª m<\/td><td>8<\/td><td>la♭<\/td><\/tr>\n<tr><td>Sexta mayor<\/td><td>6.ª M<\/td><td>9<\/td><td>la<\/td><\/tr>\n<tr><td>Séptima menor<\/td><td>7.ª m<\/td><td>10<\/td><td>si♭<\/td><\/tr>\n<tr><td>Séptima mayor<\/td><td>7.ª M<\/td><td>11<\/td><td>si<\/td><\/tr>\n<tr><td>Octava justa<\/td><td>8.ª<\/td><td>12<\/td><td>do<\/td><\/tr><\/table>\n<p><b>Truco<\/b>: en una escala mayor, todos los intervalos desde la tónica hacia arriba son mayores o justos. Un semitono menos = menor (o disminuido para un intervalo justo); un semitono más = aumentado.<\/p>\n<p>El <b>tritono<\/b> (tres tonos) divide la octava en dos: suena tenso e inestable.<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:C\n[C_D]2 [C=D]2 [C_E]2 [C=E]2 [CF]2 [C^F]2 | [CG]2 [C_A]2 [C=A]2 [C_B]2 [C=B]2 [Cc]2 |]\nw: 2.ª~m 2.ª~M 3.ª~m 3.ª~M 4.ª~J tritono 5.ª~J 6.ª~m 6.ª~M 7.ª~m 7.ª~M 8.ª","cap":"Los intervalos armónicos a partir de do."}]},{"id":"renversement-intervalles","t":"Inversión de los intervalos","title":null,"k":"invertir inversion intervalo complementario nueve","html":"<p><b>Invertir<\/b> un intervalo es colocar la nota de abajo una octava más arriba (o la de arriba una octava más abajo). Do–mi se convierte en mi–do.<\/p>\n<ul><li>Los números suman <b>9<\/b>: una tercera se convierte en sexta, una segunda en séptima, una cuarta en quinta.<\/li>\n<li>La calidad se invierte: <b>mayor ↔ menor<\/b>, <b>aumentado ↔ disminuido<\/b>, <b>justo sigue siendo justo<\/b>.<\/li><\/ul>\n<p>Ejemplos: 3M → 6m; 2m → 7M; 4J → 5J; 4aum → 5dism. Es práctico para encontrar un intervalo grande: muchas veces es más fácil calcular su inversión.<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:C\nC2 E2 | E2 c2 | D2 G2 | G2 d2 |]\nw: 3M * 6m * 4J * 5J *","cap":"3M se convierte en 6m; 4J se convierte en 5J."}]},{"id":"intervalles-composes","t":"Intervalos compuestos","title":null,"k":"novena decima undecima oncena decimotercera trecena compuesto simple","html":"<p>Un intervalo más grande que una octava es un <b>intervalo compuesto<\/b>. Se puede reducir a un intervalo simple restándole 7: una <b>9.<sup>a<\/sup><\/b> = octava + segunda, una <b>10.<sup>a<\/sup><\/b> = octava + tercera, una <b>11.<sup>a<\/sup><\/b> = octava + cuarta, una <b>13.<sup>a<\/sup><\/b> = octava + sexta.<\/p>\n<p>La calidad es la misma que la del intervalo simple: do–re (una octava más arriba) es una 9.<sup>a<\/sup> mayor. Estos nombres se usan mucho en los acordes de jazz (C9, C11, C13).<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:C\nC2 d2 | C2 e2 | C2 f2 | C2 a2 |]\nw: 9.ª~M * 10.ª~M * 11.ª~J * 13.ª~M *","cap":"Intervalos compuestos a partir de do."}]},{"id":"consonances","t":"Consonancias y disonancias","title":null,"k":"consonancia disonancia perfecta imperfecta tension reposo","html":"<p>Según la tradición clásica:<\/p>\n<ul><li><b>Consonancias perfectas<\/b>: unísono, quinta justa, octava. Muy estables, «vacías».<\/li>\n<li><b>Consonancias imperfectas<\/b>: terceras y sextas (mayores y menores). Estables y con color.<\/li>\n<li><b>Disonancias<\/b>: segundas, séptimas, intervalos aumentados y disminuidos (entre ellos el tritono). Crean una tensión que pide resolverse.<\/li><\/ul>\n<p>La <b>cuarta justa<\/b> es un caso aparte: es consonante entre dos voces superiores, pero se trata como disonancia cuando se forma con el bajo (p. ej., el acorde de <a href=\"#\" data-go=\"renversements\">sexta y cuarta<\/a>).<\/p>\n<p>Consonancia y disonancia no significan «bonito» y «feo»: la música avanza gracias a la alternancia entre tensión y reposo.<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:C\n[CG]2 [Cc]2 | [CE]2 [CA]2 | [CD]2 [CB]2 [B,F]2 [CE]2 |]","cap":"Consonancias perfectas, imperfectas y luego disonancias (el tritono si–fa se resuelve en do–mi)."}]},{"id":"reperes","t":"Referencias para reconocer de oído","title":null,"k":"cancion referencia memorizar oido intervalos comienzo","html":"<p>Para reconocer un intervalo melódico, se asocia con el <b>comienzo de una melodía conocida<\/b>. Elige tus propias referencias: las que puedas cantar sin dudar. Algunos ejemplos clásicos:<\/p>\n<table class=\"lt\"><tr><th>Intervalo<\/th><th>Ascendente<\/th><th>Descendente<\/th><\/tr>\n<tr><td>2m<\/td><td>Tiburón (tema)<\/td><td>Para Elisa (Beethoven)<\/td><\/tr>\n<tr><td>2M<\/td><td>Martinillo (Frère Jacques); Cumpleaños feliz (entre la 2.<sup>a<\/sup> y la 3.<sup>a<\/sup> nota)<\/td><td>Mary Had a Little Lamb<\/td><\/tr>\n<tr><td>3m<\/td><td>Canción de cuna de Brahms<\/td><td>Hey Jude (Beatles)<\/td><\/tr>\n<tr><td>3M<\/td><td>When the Saints Go Marching In<\/td><td>Swing Low, Sweet Chariot<\/td><\/tr>\n<tr><td>4J<\/td><td>Marcha nupcial (Wagner); La Marsellesa<\/td><td><\/td><\/tr>\n<tr><td>Tritono<\/td><td>Maria (West Side Story)<\/td><td><\/td><\/tr>\n<tr><td>5J<\/td><td>Estrellita, ¿dónde estás? (Ah ! vous dirai-je, maman); Star Wars (tema principal, 2.<sup>o<\/sup> intervalo)<\/td><td>Los Picapiedra (tema)<\/td><\/tr>\n<tr><td>6m<\/td><td>The Entertainer (Joplin), de la 3.<sup>a<\/sup> a la 4.<sup>a<\/sup> nota<\/td><td><\/td><\/tr>\n<tr><td>6M<\/td><td>My Bonnie<\/td><td>Nobody Knows the Trouble I've Seen<\/td><\/tr>\n<tr><td>7m<\/td><td>Somewhere (West Side Story)<\/td><td><\/td><\/tr>\n<tr><td>7M<\/td><td>Piensa en la octava menos un semitono: muy tensa, «quiere» subir<\/td><td><\/td><\/tr>\n<tr><td>8J<\/td><td>Over the Rainbow<\/td><td><\/td><\/tr><\/table>\n<p><b>Otras estrategias<\/b>: situar las notas en una escala (do–sol: «1 a 5»), escuchar el color (terceras «dulces», segundas que «rozan», tritono «inquieto») y cantar el intervalo mentalmente antes de responder. El módulo <b>Intervalos<\/b> te permite volver a escuchar cada intervalo a partir de la misma nota para comparar.<\/p>","ex":[]}]},{"id":"harmonie","t":"Acordes y armonía","topics":[{"id":"triades","t":"Las tríadas","title":null,"k":"acorde perfecto mayor menor disminuida aumentada fundamental tercera quinta superposicion triada","html":"<p>Una <b>tríada<\/b> es un acorde de tres notas superpuestas por <b>terceras<\/b>: la <b>fundamental<\/b>, la <b>tercera<\/b> y la <b>quinta<\/b>. Do–mi–sol es la tríada de do.<\/p>\n<table class=\"lt\"><tr><th>Tipo<\/th><th>Construcción (desde la fundamental)<\/th><th>Ejemplo<\/th><th>Símbolo<\/th><\/tr>\n<tr><td>Mayor (acorde perfecto mayor)<\/td><td>3M + 5J<\/td><td>do mi sol<\/td><td>C<\/td><\/tr>\n<tr><td>Menor (acorde perfecto menor)<\/td><td>3m + 5J<\/td><td>do mi♭ sol<\/td><td>Cm<\/td><\/tr>\n<tr><td>Disminuida (quinta disminuida)<\/td><td>3m + 5dism<\/td><td>do mi♭ sol♭<\/td><td>C°<\/td><\/tr>\n<tr><td>Aumentada (quinta aumentada)<\/td><td>3M + 5aum<\/td><td>do mi sol♯<\/td><td>C+<\/td><\/tr><\/table>\n<p>De oído: la mayor suena luminosa y estable; la menor, más oscura; la disminuida, tensa y «apretada»; la aumentada, flotante, como una pregunta.<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:C\n[CEG]4 | [C_EG]4 | [C_E_G]4 | [CE^G]4 |]\nw: mayor menor disminuida aumentada","cap":"Los cuatro tipos de tríadas sobre do."}]},{"id":"accords-degres","t":"Los acordes sobre cada grado","title":null,"k":"acordes diatonicos grados numeros romanos mayor menor I ii iii IV V vi vii","html":"<p>Al construir una tríada sobre cada nota de la escala (solo con las notas de la tonalidad), se obtienen los <b>acordes diatónicos<\/b>. Se nombran con <b>números romanos<\/b>: <b>mayúscula<\/b> = mayor, <b>minúscula<\/b> = menor, ° = disminuido, + = aumentado.<\/p>\n<table class=\"lt\"><tr><th>Mayor<\/th><td>I<\/td><td>ii<\/td><td>iii<\/td><td>IV<\/td><td>V<\/td><td>vi<\/td><td>vii°<\/td><\/tr>\n<tr><th>Do mayor<\/th><td>C<\/td><td>Dm<\/td><td>Em<\/td><td>F<\/td><td>G<\/td><td>Am<\/td><td>B°<\/td><\/tr>\n<tr><th>Menor armónica<\/th><td>i<\/td><td>ii°<\/td><td>III+ (o III)<\/td><td>iv<\/td><td>V<\/td><td>VI<\/td><td>vii°<\/td><\/tr>\n<tr><th>La menor<\/th><td>Am<\/td><td>B°<\/td><td>C+ (C)<\/td><td>Dm<\/td><td>E<\/td><td>F<\/td><td>G♯°<\/td><\/tr><\/table>\n<p>Para recordar: en mayor, <b>I, IV y V son mayores<\/b>; ii, iii y vi son menores; vii° es disminuido. En menor, se sube la sensible para que el <b>V sea mayor<\/b> (menor armónica). El III usa normalmente la 7.<sup>a<\/sup> natural (C en lugar de C+).<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:C\n[CEG]4 | [DFA]4 | [EGB]4 | [FAc]4 | [GBd]4 | [Ace]4 | [Bdf]4 |]\nw: I ii iii IV V vi vii°","cap":"Los acordes de do mayor."},{"abc":"X:1\nL:1/4\nK:Am\n[A,CE]4 | [B,DF]4 | [CEG]4 | [DFA]4 | [E^GB]4 | [FAc]4 | [^GBd]4 |]\nw: i ii° III iv V VI vii°","cap":"Los acordes de la menor (V y vii° con la sensible sol♯)."}]},{"id":"renversements","t":"Inversiones de los acordes","title":null,"k":"estado fundamental primera segunda inversion sexta cuarta bajo","html":"<p>Un acorde está en <b>estado fundamental<\/b> cuando su fundamental está en el bajo. Si otra nota está en el bajo, el acorde está <b>invertido<\/b>. Lo que cuenta es la nota más grave, no el orden de las demás notas.<\/p>\n<table class=\"lt\"><tr><th>Nota en el bajo<\/th><th>Nombre<\/th><th>Cifrado<\/th><\/tr>\n<tr><td>Fundamental<\/td><td>Estado fundamental<\/td><td>(5/3) — no se escribe nada<\/td><\/tr>\n<tr><td>Tercera<\/td><td>1.<sup>a<\/sup> inversión (acorde de sexta)<\/td><td>⁶<\/td><\/tr>\n<tr><td>Quinta<\/td><td>2.<sup>a<\/sup> inversión (acorde de sexta y cuarta)<\/td><td>⁶₄<\/td><\/tr><\/table>\n<p>Los números describen los intervalos por encima del bajo: en 1.<sup>a<\/sup> inversión (mi–sol–do), hay una tercera y una <b>sexta<\/b>; en 2.<sup>a<\/sup> (sol–do–mi), una <b>cuarta<\/b> y una <b>sexta<\/b>.<\/p>\n<p>De oído, escucha sobre todo la <b>línea del bajo<\/b>: un acorde de sexta suena más ligero, menos «asentado». El acorde de sexta y cuarta más frecuente es el <b>I⁶₄ cadencial<\/b>, justo antes del V.<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:C\n%%staves {1 2}\nV:1 clef=treble\n[EGc]4 | [Gce]4 | [ce]4 |]\nV:2 clef=bass\nC,4 | E,4 | G,4 |]\nw: I I⁶ I⁶₄","cap":"El acorde de do en estado fundamental, en 1.ª y luego en 2.ª inversión: el bajo cambia."}]},{"id":"septiemes","t":"Los acordes de séptima","title":null,"k":"septima dominante V7 mayor menor semidisminuida disminuida inversiones 6/5 4/3 4/2","html":"<p>Un <b>acorde de séptima<\/b> añade una tercera más por encima de la tríada: fundamental, tercera, quinta y <b>séptima<\/b>.<\/p>\n<table class=\"lt\"><tr><th>Tipo<\/th><th>Tríada + 7.<sup>a<\/sup><\/th><th>Sobre do<\/th><th>¿Dónde?<\/th><\/tr>\n<tr><td><b>7.<sup>a<\/sup> de dominante<\/b><\/td><td>mayor + 7m<\/td><td>C7: do mi sol si♭<\/td><td>V7<\/td><\/tr>\n<tr><td>7.<sup>a<\/sup> mayor<\/td><td>mayor + 7M<\/td><td>Cmaj7: do mi sol si<\/td><td>I, IV en mayor<\/td><\/tr>\n<tr><td>7.<sup>a<\/sup> menor<\/td><td>menor + 7m<\/td><td>Cm7: do mi♭ sol si♭<\/td><td>ii, iii, vi en mayor<\/td><\/tr>\n<tr><td>7.<sup>a<\/sup> semidisminuida<\/td><td>disminuida + 7m<\/td><td>Cø7: do mi♭ sol♭ si♭<\/td><td>vii en mayor<\/td><\/tr>\n<tr><td>7.<sup>a<\/sup> disminuida<\/td><td>disminuida + 7dism<\/td><td>C°7: do mi♭ sol♭ si𝄫<\/td><td>vii en menor<\/td><\/tr><\/table>\n<p>El <b>V7<\/b> es el más importante: contiene la sensible y el tritono (si–fa en do), que se resuelven hacia la tónica.<\/p>\n<p><b>Inversiones del V7<\/b>: V7 (fundamental en el bajo), <b>V⁶₅<\/b> (tercera), <b>V⁴₃<\/b> (quinta), <b>V⁴₂<\/b> (séptima). En la tradición francesa también se escribe 7+, 6/5 (con el 5 tachado), +6 y +4.<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:C\n[CEGB]4 | [CEG_B]4 | [C_EG_B]4 | [C_E_G_B]4 | [C_E_G__B]4 |]\nw: maj7 7 m7 ø7 °7","cap":"Los cinco acordes de séptima sobre do."},{"abc":"X:1\nL:1/4\nK:C\n[G,B,DF]4 | [B,DFG]4 | [DFGB]4 | [FGBd]4 | [EGc]4 |]\nw: V7 V⁶₅ V⁴₃ V⁴₂ I⁶","cap":"El V7 de do mayor y sus inversiones."}]},{"id":"chiffrage","t":"El cifrado de los acordes","title":null,"k":"cifrado romano americano letras simbolos C Cm C7 barra slash","html":"<p>Se usan dos sistemas complementarios:<\/p>\n<p><b>1. Números romanos<\/b> (análisis): indican el <b>grado<\/b> del acorde en la tonalidad y, por lo tanto, su función. I–IV–V–I es la misma progresión en do mayor o en sol mayor. Los números arábigos añaden la inversión (I⁶, V⁶₅…). Es lo que se pide en el módulo <b>Progresiones<\/b>.<\/p>\n<p><b>2. Cifrado americano<\/b> (letras): indica el acorde real, sin referencia a la tonalidad. Se usa en jazz, en música popular y en las tablas de acordes:<\/p>\n<table class=\"lt\"><tr><th>Símbolo<\/th><th>Acorde<\/th><\/tr>\n<tr><td>C<\/td><td>do mayor<\/td><\/tr><tr><td>Cm (o C−)<\/td><td>do menor<\/td><\/tr>\n<tr><td>C° (o Cdim)<\/td><td>do disminuido<\/td><\/tr><tr><td>C+ (o Caug)<\/td><td>do aumentado<\/td><\/tr>\n<tr><td>C7<\/td><td>do 7.<sup>a<\/sup> de dominante<\/td><\/tr><tr><td>Cmaj7 (o CΔ)<\/td><td>do 7.<sup>a<\/sup> mayor<\/td><\/tr>\n<tr><td>Cm7<\/td><td>do menor 7<\/td><\/tr><tr><td>Cø (o Cm7♭5)<\/td><td>do semidisminuido<\/td><\/tr>\n<tr><td>Csus4<\/td><td>do–fa–sol (cuarta en lugar de la tercera)<\/td><\/tr>\n<tr><td>C/E<\/td><td>acorde de do con mi en el bajo<\/td><\/tr><\/table>","ex":[]},{"id":"fonctions","t":"Funciones tonales y progresiones","title":null,"k":"tonica subdominante predominante dominante funcion progresion enlace","html":"<p>En una tonalidad, los acordes se agrupan en tres <b>funciones<\/b>:<\/p>\n<ul><li><b>Tónica<\/b> (reposo): I, y a veces vi o iii.<\/li>\n<li><b>Predominante<\/b> o subdominante (alejamiento): IV y ii.<\/li>\n<li><b>Dominante<\/b> (tensión, llamada hacia la tónica): V, V7 y vii°.<\/li><\/ul>\n<p>El movimiento más natural es: <b>Tónica → Predominante → Dominante → Tónica<\/b>. Algunos enlaces muy frecuentes:<\/p>\n<ul><li>I – IV – V – I<\/li><li>I – ii – V – I (y ii – V – I en jazz)<\/li><li>I – vi – IV – V<\/li><li>I – V – vi – IV (muy común en la música pop)<\/li><li>vi – ii – V – I (progresión por quintas)<\/li><\/ul>\n<p><b>Método para los dictados armónicos<\/b>: escucha primero el <b>bajo<\/b>, luego la <b>calidad<\/b> de cada acorde (mayor o menor), y después usa lo que sabes de los enlaces. Ejemplos: un bajo que sube de do a fa sugiere IV; re en el bajo suele sugerir ii; el bajo que va de sol a la (en lugar de sol a do) anuncia una cadencia rota.<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:C\n%%staves {1 2}\nV:1 clef=treble\n[EGc]2 [FAc]2 [DGB]2 [EGc]2 || [DFA]2 [DGB]2 [EGc]2 |]\nV:2 clef=bass\nC,2 F,,2 G,,2 C,2 || D,2 G,,2 C,2 |]\nw: I IV V I ii V I","cap":"I – IV – V – I, y luego ii – V – I en do mayor."}]},{"id":"cadences","t":"Las cadencias","title":null,"k":"cadencia perfecta autentica imperfecta plagal semicadencia rota evitada","html":"<p>Una <b>cadencia<\/b> es el enlace de acordes que termina una frase, como la puntuación al final de una oración.<\/p>\n<table class=\"lt\"><tr><th>Cadencia<\/th><th>Acordes<\/th><th>Efecto<\/th><\/tr>\n<tr><td><b>Perfecta<\/b> (auténtica)<\/td><td>V – I, los dos acordes en estado fundamental<\/td><td>Punto final<\/td><\/tr>\n<tr><td><b>Imperfecta<\/b><\/td><td>V – I con al menos uno de los dos acordes invertido<\/td><td>Conclusión más débil<\/td><\/tr>\n<tr><td><b>Semicadencia<\/b><\/td><td>… – V (se detiene en la dominante)<\/td><td>Coma, pregunta<\/td><\/tr>\n<tr><td><b>Plagal<\/b><\/td><td>IV – I<\/td><td>El «Amén» de los himnos<\/td><\/tr>\n<tr><td><b>Rota<\/b><\/td><td>V – vi<\/td><td>Sorpresa: se esperaba I<\/td><\/tr><\/table>\n<p>Variante: en varios manuales norteamericanos, la cadencia perfecta exige además la tónica en la voz superior; si no, se habla de cadencia auténtica imperfecta. Comprueba qué definición se usa en tu curso.<\/p>","ex":[{"abc":"X:1\nL:1/4\nK:C\n%%staves {1 2}\nV:1 clef=treble\n[DGB]2 [EGc]2 || [FAc]2 [EGc]2 || [EGc]2 [DGB]2 || [DGB]2 [CEc]2 |]\nV:2 clef=bass\nG,,2 C,2 || F,,2 C,2 || C,2 G,,2 || G,,2 A,,2 |]\nw: V I IV I I V V vi","cap":"Cadencia perfecta, plagal, semicadencia y cadencia rota, en do mayor."}]},{"id":"notes-etrangeres","t":"Notas extrañas","title":null,"k":"notas extranas nota de paso bordadura apoyatura retardo anticipacion escapada pedal","html":"<p>Una melodía no contiene solo notas del acorde. Las <b>notas extrañas<\/b> (que no pertenecen al acorde) unen y dan color a la línea:<\/p>\n<ul><li><b>Nota de paso<\/b>: une dos notas del acorde por movimiento conjunto (do–<u>re<\/u>–mi sobre el acorde de do).<\/li>\n<li><b>Bordadura<\/b>: deja una nota del acorde por grado conjunto y vuelve a ella (mi–<u>fa<\/u>–mi).<\/li>\n<li><b>Apoyatura<\/b>: disonancia colocada en el tiempo fuerte, atacada directamente, que se resuelve por grado conjunto.<\/li>\n<li><b>Retardo<\/b>: una nota del acorde anterior se mantiene sobre el nuevo acorde y luego desciende (preparación – disonancia – resolución).<\/li>\n<li><b>Anticipación<\/b>: una nota del acorde siguiente llega un poco antes de tiempo.<\/li>\n<li><b>Pedal<\/b>: nota mantenida (a menudo en el bajo) mientras los acordes cambian.<\/li><\/ul>","ex":[{"abc":"X:1\nL:1/8\nK:C\n%%staves {1 2}\nV:1 clef=treble\nc2 d2 e4 | e2 f2 e4 | d4 c4 |]\nw: * paso * * bordadura * apoyat. *\nV:2 clef=bass\n[C,E,G,]8 | [C,E,G,]8 | [C,E,G,]8 |]","cap":"Sobre el acorde de do: nota de paso, bordadura, apoyatura."}]}]},{"id":"expression","t":"Expresión","topics":[{"id":"nuances","t":"Los matices","title":null,"k":"matices dinamica piano forte mezzo crescendo decrescendo diminuendo sforzando fortepiano","html":"<p>Los <b>matices<\/b> indican la intensidad (el volumen). Se escriben debajo del pentagrama, abreviados en italiano:<\/p>\n<table class=\"lt\"><tr><th>Signo<\/th><th>Italiano<\/th><th>Significado<\/th><\/tr>\n<tr><td><b><i>ppp<\/i><\/b><\/td><td>pianississimo<\/td><td>extremadamente suave<\/td><\/tr>\n<tr><td><b><i>pp<\/i><\/b><\/td><td>pianissimo<\/td><td>muy suave<\/td><\/tr>\n<tr><td><b><i>p<\/i><\/b><\/td><td>piano<\/td><td>suave<\/td><\/tr>\n<tr><td><b><i>mp<\/i><\/b><\/td><td>mezzo piano<\/td><td>medianamente suave<\/td><\/tr>\n<tr><td><b><i>mf<\/i><\/b><\/td><td>mezzo forte<\/td><td>medianamente fuerte<\/td><\/tr>\n<tr><td><b><i>f<\/i><\/b><\/td><td>forte<\/td><td>fuerte<\/td><\/tr>\n<tr><td><b><i>ff<\/i><\/b><\/td><td>fortissimo<\/td><td>muy fuerte<\/td><\/tr>\n<tr><td><b><i>fff<\/i><\/b><\/td><td>fortississimo<\/td><td>extremadamente fuerte<\/td><\/tr><\/table>\n<ul><li><b>Crescendo<\/b> (cresc. o ⟨): aumentando; <b>decrescendo<\/b> o <b>diminuendo<\/b> (decresc., dim. o ⟩): disminuyendo.<\/li>\n<li><b><i>sfz<\/i><\/b> (sforzando): acento repentino en una nota; <b><i>fp<\/i><\/b> (fortepiano): fuerte e inmediatamente suave; <i>subito<\/i>: de repente.<\/li><\/ul>","ex":[{"abc":"X:1\nM:4/4\nL:1/8\nK:C\n!p! c2 d2 e2 f2 | !crescendo(! g2 a2 b2 c'2 !crescendo)! | !f! d'4 !diminuendo(! c'2 b2 !diminuendo)! | !pp! c8 |]","cap":"Piano, crescendo, forte, diminuendo, pianissimo."}]},{"id":"articulations","t":"Las articulaciones","title":null,"k":"staccato legato tenuto acento marcato calderon ligadura articulacion","html":"<p>Las <b>articulaciones<\/b> indican cómo atacar y unir las notas:<\/p>\n<table class=\"lt\"><tr><th>Signo<\/th><th>Nombre<\/th><th>Efecto<\/th><\/tr>\n<tr><td>punto encima o debajo<\/td><td><b>Staccato<\/b><\/td><td>nota separada, corta<\/td><\/tr>\n<tr><td>raya horizontal<\/td><td><b>Tenuto<\/b><\/td><td>nota sostenida todo su valor, ligeramente apoyada<\/td><\/tr>\n<tr><td>&gt;<\/td><td><b>Acento<\/b><\/td><td>ataque más fuerte<\/td><\/tr>\n<tr><td>^<\/td><td><b>Marcato<\/b><\/td><td>acento muy marcado<\/td><\/tr>\n<tr><td>curva sobre varias notas<\/td><td><b>Legato<\/b> (ligadura de expresión)<\/td><td>notas ligadas, sin interrupción<\/td><\/tr>\n<tr><td>𝄐<\/td><td><b>Calderón<\/b><\/td><td>sostener más tiempo, a elección<\/td><\/tr><\/table>","ex":[{"abc":"X:1\nM:4/4\nL:1/8\nK:C\n.c2 .d2 !tenuto!e2 !tenuto!f2 | !accent!g2 !accent!g2 !marcato!a2 !marcato!a2 | (g2 f2 e2 d2) | !fermata!c8 |]","cap":"Staccato, tenuto, acento, marcato, legato y calderón."}]},{"id":"reprises","t":"Signos de repetición y de estructura","title":null,"k":"repeticion volta primera segunda casilla da capo dal segno coda fine","html":"<ul><li><b>Barras de repetición<\/b> (‖: … :‖): el pasaje se toca dos veces. Si no hay barra de inicio, se repite desde el principio de la pieza.<\/li>\n<li><b>1.<sup>a<\/sup> y 2.<sup>a<\/sup> casilla<\/b> (corchetes numerados): la primera vez, se toca la casilla 1 y se repite; la segunda vez, se salta la casilla 1 y se toca la casilla 2.<\/li>\n<li><b>D.C.<\/b> (<i>Da Capo<\/i>): volver al principio. <b>D.C. al Fine<\/b>: volver al principio y detenerse en la palabra <b>Fine<\/b>.<\/li>\n<li><b>D.S.<\/b> (<i>Dal Segno<\/i>): volver al signo 𝄋.<\/li>\n<li><b>Coda<\/b> (𝄌): sección final. «D.S. al Coda»: volver al signo, tocar hasta «a la coda» (𝄌) y luego saltar a la coda.<\/li><\/ul>\n<p>Antes de leer, identifica el recorrido: dónde están las repeticiones, las casillas, el signo y la coda.<\/p>","ex":[{"abc":"X:1\nM:4/4\nL:1/4\nK:C\n|: c d e f | g a g f |[1 e d c2 :|[2 e d c2 |]","cap":"Repetición con 1.ª y 2.ª casilla."}]},{"id":"ornements","t":"Los ornamentos","title":null,"k":"trino mordente grupeto apoyatura acciaccatura nota de adorno ornamento","html":"<ul><li><b>Trino<\/b> (tr): alternancia rápida entre la nota escrita y la nota vecina superior.<\/li>\n<li><b>Mordente<\/b>: nota escrita – nota vecina – nota escrita, muy rápido. Hacia abajo: el mordente (el <i>pincé<\/i> de los clavecinistas franceses); hacia arriba: el mordente superior (<i>pralltriller<\/i>, trino corto).<\/li>\n<li><b>Grupeto<\/b> (∽): nota superior – nota escrita – nota inferior – nota escrita.<\/li>\n<li><b>Apoyatura<\/b> (nota pequeña): toma una parte del valor de la nota principal, en el tiempo.<\/li>\n<li><b>Acciaccatura<\/b> (nota pequeña tachada): se toca muy brevemente, justo antes de la nota principal.<\/li><\/ul>\n<p>La ejecución exacta depende de la época y del estilo: en la música barroca, por ejemplo, el trino suele empezar por la nota superior.<\/p>","ex":[{"abc":"X:1\nM:4/4\nL:1/4\nK:C\n!trill!c2 !mordent!d2 | !turn!e2 {f}e2 | {/f}e2 c2 |]","cap":"Trino, mordente, grupeto, apoyatura y acciaccatura."}]}]}]},tpl:{},cache:{}};
(function buildTemplates(){

  const press=(m,silent)=>{A.init();if(!silent)A.note(m,A.ctx.currentTime+.005,.45,.42,A.out);onPress(m);};
  for(let m=lo;m<=hi;m++){

    const wk=el('div',{class:'wk','aria-label':FR_PC[pc]},el('span',{class:'lbl'+(pc===0?' c':'')},FR_PC[pc]));
    wk.addEventListener('pointerdown',e=>{e.preventDefault();press(m);});keys[m]=wk;wrap.append(wk);
    if([0,2,5,7,9].includes(pc)&&m+1<=hi){const bk=el('div',{class:'bk','aria-label':FR_PC[pc+1]});bk.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();press(m+1);});wk.append(bk);keys[m+1]=bk;}

    flash(m,cls){const k=keys[m];if(!k)return;k.classList.remove('f-ok','f-bad','f-on');void k.offsetWidth;k.classList.add(cls);setTimeout(()=>k.classList.remove(cls),420);},
